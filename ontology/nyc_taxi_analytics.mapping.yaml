version: 0.2.0.dev0
name: nyc_taxi_trips_mapping
description: "Maps the Trip concept onto the trips document. The two zone links are declared in the ontology but not mapped here: the trips dataset exposes pickup_zone_key and dropoff_zone_key, which are surrogates over a zone's natural key and valid-from date, while the ontology identifies Zone by its natural key across versions."
ontology_ref:
  name: nyc_taxi
semantic_model_ref:
  name: nyc_taxi_trips
concept_mappings:
- concept: Trip
  object_mappings:
  - referent_mappings:
    - relationship: trip_key
      expression: trips.trip_key
    - relationship: shift
      referent_mappings:
      - relationship: shift_id
        expression: trips.shift_id
- concept: Shift
  object_mappings:
  - referent_mappings:
    - relationship: shift_id
      expression: trips.shift_id
- concept: Zone
  object_mappings:
  - referent_mappings:
    - relationship: zone_id
      expression: zone.zone_natural_key

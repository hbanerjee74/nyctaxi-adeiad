version: 0.2.0.dev0
name: nyc_taxi_zone_poi_mapping
description: Maps the Zone concept onto the zone-of-interest document, which carries the TLC location id but no trip and no fleet shift.
ontology_ref:
  name: nyc_taxi
semantic_model_ref:
  name: nyc_taxi_zone_poi
concept_mappings:
- concept: Zone
  object_mappings:
  - referent_mappings:
    - relationship: zone_id
      expression: zone_poi.zone_natural_key

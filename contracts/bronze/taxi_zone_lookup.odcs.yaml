apiVersion: v3.2.0
kind: DataContract
id: c08a9cfd-a552-5141-ac50-4b1d3a5b4f4c
name: taxi_zone_lookup
version: 2.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: bronze
schema:
  - name: taxi_zone_lookup
    properties:
      - name: LocationID
        description: "TLC taxi zone identifier."
        logicalType: integer
        physicalType: BIGINT
        primaryKey: true
      - name: Borough
        description: "Borough the zone belongs to."
        logicalType: string
        physicalType: VARCHAR
      - name: Zone
        description: "Name of the zone."
        logicalType: string
        physicalType: VARCHAR
      - name: service_zone
        description: "TLC service zone grouping for the zone."
        logicalType: string
        physicalType: VARCHAR

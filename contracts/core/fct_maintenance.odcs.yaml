apiVersion: v3.2.0
kind: DataContract
id: 97947e8f-11d3-5e7f-8778-c53e454545fa
name: fct_maintenance
version: 2.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: fct_maintenance
    properties:
      - name: maintenance_id
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: vehicle_key
        logicalType: integer
        physicalType: BIGINT
      - name: garage_key
        logicalType: integer
        physicalType: BIGINT
      - name: started_date_key
        logicalType: integer
        physicalType: INTEGER
      - name: started_date
        logicalType: date
        physicalType: TIMESTAMP WITH TIME ZONE
      - name: ended_date
        logicalType: date
        physicalType: TIMESTAMP WITH TIME ZONE
      - name: down_days
        logicalType: integer
        physicalType: BIGINT
      - name: maintenance_type
        logicalType: string
        physicalType: VARCHAR
      - name: cost_usd
        logicalType: number
        physicalType: BIGINT
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

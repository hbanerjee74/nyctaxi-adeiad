apiVersion: v3.2.0
kind: DataContract
id: 2b07e811-f17f-5272-aae8-1fe29c31de24
name: fct_shift
version: 2.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: fct_shift
    properties:
      - name: shift_id
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: driver_key
        logicalType: integer
        physicalType: BIGINT
        relationships:
          - to: dim_driver.driver_key
      - name: vehicle_key
        logicalType: integer
        physicalType: INTEGER
        relationships:
          - to: dim_vehicle.vehicle_key
      - name: occupancy_rate
        logicalType: number
        physicalType: DOUBLE
      - name: shift_date_key
        logicalType: integer
        physicalType: INTEGER
      - name: shift_date
        logicalType: date
        physicalType: DATE
      - name: garage_key
        logicalType: integer
        physicalType: BIGINT
      - name: engagement_type
        logicalType: string
        physicalType: VARCHAR
      - name: lease_type
        logicalType: string
        physicalType: VARCHAR
      - name: shift_start_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: effective_end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: is_unclosed_shift
        logicalType: boolean
        physicalType: BOOLEAN
      - name: online_seconds
        logicalType: integer
        physicalType: BIGINT
      - name: on_trip_seconds
        logicalType: integer
        physicalType: HUGEINT
      - name: available_seconds
        logicalType: integer
        physicalType: HUGEINT
      - name: break_seconds
        logicalType: integer
        physicalType: HUGEINT
      - name: unaccounted_seconds
        logicalType: integer
        physicalType: HUGEINT
      - name: idle_rate
        logicalType: number
        physicalType: DOUBLE
      - name: trip_count
        logicalType: integer
        physicalType: BIGINT
      - name: gross_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: fare_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: tip_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: airport_fee_collected
        logicalType: number
        physicalType: DOUBLE
      - name: surcharge_collected
        logicalType: number
        physicalType: DOUBLE
      - name: recognised_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: paid_miles
        logicalType: number
        physicalType: DOUBLE
      - name: paid_seconds
        logicalType: integer
        physicalType: HUGEINT
      - name: shift_cost
        logicalType: number
        physicalType: DOUBLE
      - name: shift_margin
        logicalType: number
        physicalType: DOUBLE
      - name: revenue_per_online_hour
        logicalType: number
        physicalType: DOUBLE
      - name: revenue_per_paid_mile
        logicalType: number
        physicalType: DOUBLE
      - name: odometer_miles
        logicalType: number
        physicalType: DOUBLE
      - name: paid_mile_ratio
        logicalType: number
        physicalType: DOUBLE
      - name: negative_interval_count
        logicalType: integer
        physicalType: BIGINT
      - name: telematics_source
        logicalType: string
        physicalType: VARCHAR
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

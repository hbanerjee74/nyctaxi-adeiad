apiVersion: v3.2.0
kind: DataContract
id: bff3122d-9cd2-531f-b113-6c17d6832c15
name: dim_date
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: dim_date
    properties:
      - name: date_key
        logicalType: integer
        physicalType: INTEGER
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: calendar_date
        logicalType: date
        physicalType: DATE
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: calendar_year
        logicalType: integer
        physicalType: BIGINT
      - name: calendar_quarter
        logicalType: integer
        physicalType: BIGINT
      - name: calendar_month
        logicalType: integer
        physicalType: BIGINT
      - name: month_name
        logicalType: string
        physicalType: VARCHAR
      - name: iso_week
        logicalType: integer
        physicalType: BIGINT
      - name: month_start_date
        logicalType: date
        physicalType: TIMESTAMP
      - name: week_start_date
        logicalType: date
        physicalType: TIMESTAMP
      - name: day_of_week
        logicalType: integer
        physicalType: BIGINT
      - name: day_name
        logicalType: string
        physicalType: VARCHAR
      - name: is_weekend
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_holiday
        logicalType: boolean
        physicalType: BOOLEAN
      - name: holiday_name
        logicalType: string
        physicalType: VARCHAR
      - name: holiday_class
        logicalType: string
        physicalType: VARCHAR
      - name: is_school_term
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_non_working_day
        logicalType: boolean
        physicalType: BOOLEAN
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

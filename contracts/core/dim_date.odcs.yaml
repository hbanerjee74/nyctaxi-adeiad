apiVersion: v3.2.0
kind: DataContract
id: bff3122d-9cd2-531f-b113-6c17d6832c15
name: dim_date
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: dim_date
    dataGranularityDescription: Date spine with holiday, weekend, and school-term flags from master data.
    properties:
      - name: date_key
        logicalType: integer
        physicalType: INTEGER
        primaryKey: true
        description: yyyymmdd integer key.
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: calendar_date
        logicalType: date
        physicalType: DATE
        description: Calendar date.
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: calendar_year
        logicalType: integer
        physicalType: BIGINT
        description: Calendar year grain.
      - name: calendar_quarter
        logicalType: integer
        physicalType: BIGINT
        description: Calendar quarter grain (1-4).
      - name: calendar_month
        logicalType: integer
        physicalType: BIGINT
        description: Calendar month grain (1-12).
      - name: month_name
        logicalType: string
        physicalType: VARCHAR
        description: Month label for the month grain.
      - name: iso_week
        logicalType: integer
        physicalType: BIGINT
      - name: month_start_date
        logicalType: date
        physicalType: TIMESTAMP
        description: First day of the calendar month; key of the month level, since calendar_month repeats every year.
      - name: week_start_date
        logicalType: date
        physicalType: TIMESTAMP
        description: Monday that starts the calendar week (ADR 0014); key of the week level.
      - name: day_of_week
        logicalType: integer
        physicalType: BIGINT
      - name: day_name
        logicalType: string
        physicalType: VARCHAR
      - name: is_weekend
        logicalType: boolean
        physicalType: BOOLEAN
        description: Saturday or Sunday.
      - name: is_holiday
        logicalType: boolean
        physicalType: BOOLEAN
        description: Master-data holiday flag; corrections restate reports without code change.
      - name: holiday_name
        logicalType: string
        physicalType: VARCHAR
      - name: holiday_class
        logicalType: string
        physicalType: VARCHAR
      - name: is_school_term
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_non_working_day
        logicalType: boolean
        physicalType: BOOLEAN
        description: Weekend or holiday; weekday holidays behave like weekends for demand.
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

apiVersion: v3.2.0
kind: DataContract
id: 262efed7-9487-51b8-b4e4-f7e83e0a5237
name: dim_vehicle
version: 2.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: dim_vehicle
    properties:
      - name: vehicle_key
        logicalType: integer
        physicalType: BIGINT
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: medallion_number
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: vin
        logicalType: string
        physicalType: VARCHAR
      - name: make
        logicalType: string
        physicalType: VARCHAR
      - name: model
        logicalType: string
        physicalType: VARCHAR
      - name: make_model
        logicalType: string
        physicalType: VARCHAR
      - name: model_year
        logicalType: integer
        physicalType: BIGINT
      - name: vehicle_age_years
        logicalType: integer
        physicalType: BIGINT
      - name: fuel_type
        logicalType: string
        physicalType: VARCHAR
      - name: is_low_emission
        logicalType: boolean
        physicalType: BOOLEAN
      - name: wheelchair_accessible
        logicalType: boolean
        physicalType: BOOLEAN
      - name: garage_key
        logicalType: integer
        physicalType: BIGINT
      - name: garage_name
        logicalType: string
        physicalType: VARCHAR
      - name: in_service_date
        logicalType: date
        physicalType: TIMESTAMP WITH TIME ZONE
      - name: retired_date
        logicalType: date
        physicalType: TIMESTAMP WITH TIME ZONE
      - name: is_in_service
        logicalType: boolean
        physicalType: BOOLEAN
      - name: maintenance_events
        logicalType: integer
        physicalType: BIGINT
      - name: maintenance_down_days
        logicalType: integer
        physicalType: HUGEINT
      - name: maintenance_cost_usd
        logicalType: number
        physicalType: HUGEINT
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

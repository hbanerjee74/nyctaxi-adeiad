apiVersion: v3.2.0
kind: DataContract
id: 18a03801-8362-5453-8397-f3d2d7e073a5
name: fct_status_interval
version: 2.1.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: fct_status_interval
    properties:
      - name: interval_id
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: status_code
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: invalidValues
            arguments:
              valid_values:
                - LOGIN
                - AVAILABLE
                - DISPATCHED
                - ON_TRIP
                - BREAK
                - LOGOUT
            mustBe: 0
      - name: shift_id
        logicalType: string
        physicalType: VARCHAR
      - name: driver_key
        logicalType: integer
        physicalType: BIGINT
        relationships:
          - to: dim_driver.driver_key
      - name: vehicle_key
        logicalType: integer
        physicalType: INTEGER
        relationships:
          - to: dim_vehicle.vehicle_key
      - name: interval_date_key
        logicalType: integer
        physicalType: INTEGER
        relationships:
          - to: dim_date.date_key
      - name: interval_date
        logicalType: date
        physicalType: DATE
      - name: interval_hour
        logicalType: integer
        physicalType: BIGINT
        relationships:
          - to: dim_daypart.hour_of_day
      - name: daypart_code
        logicalType: string
        physicalType: VARCHAR
      - name: zone_key
        logicalType: string
        physicalType: VARCHAR
        relationships:
          - to: dim_zone.zone_key
      - name: zone_natural_key
        logicalType: integer
        physicalType: INTEGER
      - name: interval_start_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: interval_end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: interval_seconds
        logicalType: integer
        physicalType: BIGINT
      - name: is_terminal_interval
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_negative_interval
        logicalType: boolean
        physicalType: BOOLEAN
      - name: skew_seconds
        logicalType: integer
        physicalType: BIGINT
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

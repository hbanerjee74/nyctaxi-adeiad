apiVersion: v3.2.0
kind: DataContract
id: d705ae57-ddfc-50b6-9a9a-f33b8e7b355d
name: bridge_zone_poi
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: bridge_zone_poi
    properties:
      - name: poi_id
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: zone_natural_key
        logicalType: integer
        physicalType: BIGINT
      - name: poi_category
        logicalType: string
        physicalType: VARCHAR
      - name: poi_category_name
        logicalType: string
        physicalType: VARCHAR
      - name: poi_name
        logicalType: string
        physicalType: VARCHAR
      - name: demand_weight
        logicalType: integer
        physicalType: INTEGER
      - name: allocation_factor
        logicalType: number
        physicalType: DOUBLE
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_analytics.ossie.yaml
    type: businessDefinition

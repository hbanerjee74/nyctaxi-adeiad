apiVersion: v3.2.0
kind: DataContract
id: d4ffe397-9122-546c-a7ea-f2dee59d3a48
name: dim_driver
version: 2.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: dim_driver
    properties:
      - name: driver_key
        logicalType: integer
        physicalType: BIGINT
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: garage_key
        logicalType: integer
        physicalType: BIGINT
        relationships:
          - to: dim_garage.garage_key
      - name: hack_licence_no
        logicalType: string
        physicalType: VARCHAR
      - name: driver_ref
        logicalType: string
        physicalType: VARCHAR
      - name: engagement_type
        logicalType: string
        physicalType: VARCHAR
      - name: driver_status
        logicalType: string
        physicalType: VARCHAR
      - name: is_wav_certified
        logicalType: boolean
        physicalType: BOOLEAN
      - name: hire_date
        logicalType: date
        physicalType: DATE
      - name: termination_date
        logicalType: date
        physicalType: DATE
      - name: tenure_days
        logicalType: integer
        physicalType: BIGINT
      - name: home_garage_name
        logicalType: string
        physicalType: VARCHAR
      - name: lease_id
        logicalType: integer
        physicalType: BIGINT
      - name: lease_type
        logicalType: string
        physicalType: VARCHAR
      - name: lease_rate
        logicalType: number
        physicalType: DECIMAL(22,2)
      - name: revenue_share_pct
        logicalType: number
        physicalType: DECIMAL(3,2)
      - name: primary_vehicle_id
        logicalType: integer
        physicalType: BIGINT
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

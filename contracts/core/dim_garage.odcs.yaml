apiVersion: v3.2.0
kind: DataContract
id: 74987f1a-e398-5566-8b82-35f2d97727e1
name: dim_garage
version: 2.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: core
schema:
  - name: dim_garage
    properties:
      - name: garage_key
        logicalType: integer
        physicalType: INTEGER
        primaryKey: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: garage_name
        logicalType: string
        physicalType: VARCHAR
      - name: borough_name
        logicalType: string
        physicalType: VARCHAR
      - name: bay_capacity
        logicalType: integer
        physicalType: INTEGER
      - name: opened_date
        logicalType: date
        physicalType: DATE
      - name: assigned_vehicle_count
        logicalType: integer
        physicalType: BIGINT
authoritativeDefinitions:
  - url: logical-model/nyc_taxi_fleet.ossie.yaml
    type: businessDefinition

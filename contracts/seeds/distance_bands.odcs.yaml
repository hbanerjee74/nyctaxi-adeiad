apiVersion: v3.2.0
kind: DataContract
id: edb9e3cf-1d0b-5c65-aac4-2ceb39b16895
name: distance_bands
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: seeds
schema:
  - name: distance_bands
    dataGranularityDescription: Trip distance banding used by every distance-profile aggregate.
    properties:
      - name: band_order
        logicalType: integer
        physicalType: INTEGER
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: distance_band
        logicalType: string
        physicalType: VARCHAR
      - name: min_miles
        logicalType: integer
        physicalType: INTEGER
      - name: max_miles
        logicalType: integer
        physicalType: INTEGER

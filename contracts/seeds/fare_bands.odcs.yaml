apiVersion: v3.2.0
kind: DataContract
id: 82721b56-fd32-5005-a912-622205581e84
name: fare_bands
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: seeds
schema:
  - name: fare_bands
    dataGranularityDescription: Trip total banding, in dollars.
    properties:
      - name: band_order
        logicalType: integer
        physicalType: INTEGER
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: fare_band
        logicalType: string
        physicalType: VARCHAR
      - name: min_total
        logicalType: integer
        physicalType: INTEGER
      - name: max_total
        logicalType: integer
        physicalType: INTEGER

        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_snow_day
        logicalType: boolean
        physicalType: BOOLEAN
      - name: weather_class
        logicalType: string
        physicalType: VARCHAR
      - name: trip_count
        logicalType: integer
        physicalType: BIGINT

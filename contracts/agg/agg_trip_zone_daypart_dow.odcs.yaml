        logicalType: number
        physicalType: DOUBLE
      - name: surcharge_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: total_miles
        logicalType: number
        physicalType: DOUBLE
      - name: total_paid_hours
        logicalType: number
        physicalType: DOUBLE
      - name: avg_total_amount
        logicalType: number
        physicalType: DOUBLE
      - name: avg_trip_distance
        logicalType: number
        physicalType: DOUBLE

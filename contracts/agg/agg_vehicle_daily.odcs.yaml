apiVersion: v3.2.0
kind: DataContract
id: f75e64d6-bb26-5665-bc1e-a3b76385cb76
name: agg_vehicle_daily
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: agg
schema:
  - name: agg_vehicle_daily
    properties:
      - name: shift_date
        logicalType: date
        physicalType: DATE
      - name: date_key
        logicalType: integer
        physicalType: INTEGER
      - name: vehicle_key
        logicalType: integer
        physicalType: INTEGER
      - name: medallion_number
        logicalType: string
        physicalType: VARCHAR
      - name: make_model
        logicalType: string
        physicalType: VARCHAR
      - name: fuel_type
        logicalType: string
        physicalType: VARCHAR
      - name: is_low_emission
        logicalType: boolean
        physicalType: BOOLEAN
      - name: garage_key
        logicalType: integer
        physicalType: BIGINT
      - name: shift_count
        logicalType: integer
        physicalType: BIGINT
      - name: distinct_drivers
        logicalType: integer
        physicalType: BIGINT
      - name: trip_count
        logicalType: integer
        physicalType: HUGEINT
      - name: online_hours
        logicalType: number
        physicalType: DOUBLE
      - name: on_trip_hours
        logicalType: number
        physicalType: DOUBLE
      - name: gross_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: paid_miles
        logicalType: number
        physicalType: DOUBLE
      - name: odometer_miles
        logicalType: number
        physicalType: DOUBLE
      - name: occupancy_rate
        logicalType: number
        physicalType: DOUBLE
      - name: asset_utilisation_rate
        logicalType: number
        physicalType: DOUBLE
      - name: paid_mile_ratio
        logicalType: number
        physicalType: DOUBLE

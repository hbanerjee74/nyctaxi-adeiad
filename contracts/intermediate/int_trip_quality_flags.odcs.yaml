apiVersion: v3.2.0
kind: DataContract
id: c385c855-789a-5489-9a06-43ec1f0c66f9
name: int_trip_quality_flags
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: intermediate
schema:
  - name: int_trip_quality_flags
    dataGranularityDescription: Every quality verdict for a trip, in one row. Nothing is deleted -- ADR 0003 puts the billable rule in gold, and an excluded trip still happened.
    properties:
      - name: trip_key
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: is_billable
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_refund
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_zero_distance
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_implausibly_short
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_implausibly_fast
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_negative_duration
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_zero_passenger
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_missing_passenger_count
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_sparse_vendor_feed
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_unresolved_pickup_zone
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_unresolved_dropoff_zone
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_undocumented_rate_code
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_missing_airport_fee
        logicalType: boolean
        physicalType: BOOLEAN

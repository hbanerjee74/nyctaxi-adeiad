apiVersion: v3.2.0
kind: DataContract
id: d90866c6-6bcf-535d-a141-b315a8944ba3
name: int_status_intervals
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: intermediate
schema:
  - name: int_status_intervals
    dataGranularityDescription: The status stream sessionized into intervals. Ordered on event_ts, never received_ts. Terminal intervals on unclosed shifts are closed against the shift's effective end rather than left open.
    properties:
      - name: interval_id
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: interval_seconds
        logicalType: integer
        physicalType: BIGINT
        description: Floored at zero; `is_negative_interval` records where that floor bit.
      - name: shift_id
        logicalType: string
        physicalType: VARCHAR
      - name: driver_id
        logicalType: integer
        physicalType: BIGINT
      - name: vehicle_id
        logicalType: integer
        physicalType: INTEGER
      - name: status_code
        logicalType: string
        physicalType: VARCHAR
      - name: zone_id
        logicalType: integer
        physicalType: INTEGER
      - name: interval_start_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: interval_end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: is_terminal_interval
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_negative_interval
        logicalType: boolean
        physicalType: BOOLEAN
      - name: skew_seconds
        logicalType: integer
        physicalType: BIGINT
      - name: interval_date
        logicalType: date
        physicalType: DATE
      - name: interval_hour
        logicalType: integer
        physicalType: BIGINT

apiVersion: v3.2.0
kind: DataContract
id: fff4b099-46b5-5997-96a8-c624c81dde1e
name: stg_mdm__payment_methods
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_mdm__payment_methods
    dataGranularityDescription: One row per payment method, as the master-data platform delivers it.
    properties:
      - name: payment_type
        logicalType: integer
        physicalType: INTEGER
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: payment_method_name
        logicalType: string
        physicalType: VARCHAR
      - name: settlement_class
        logicalType: string
        physicalType: VARCHAR
      - name: tip_is_captured
        logicalType: boolean
        physicalType: BOOLEAN
      - name: settlement_days
        logicalType: integer
        physicalType: INTEGER
      - name: processor_fee_pct
        logicalType: number
        physicalType: DECIMAL(5,4)
      - name: counts_as_revenue
        logicalType: boolean
        physicalType: BOOLEAN

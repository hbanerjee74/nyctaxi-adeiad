apiVersion: v3.2.0
kind: DataContract
id: 3c1843bb-d64c-519f-b713-9e934c8033b1
name: stg_ops__shifts
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_ops__shifts
    dataGranularityDescription: Shift sign-ons with an effective end resolved once. ~1.5% of shifts never emitted LOGOUT; `is_unclosed_shift` marks where the derived end was substituted so nobody has to guess.
    properties:
      - name: shift_id
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: vehicle_id
        logicalType: integer
        physicalType: INTEGER
      - name: driver_id
        logicalType: integer
        physicalType: BIGINT
      - name: shift_start_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: shift_end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: derived_end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: effective_end_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: is_unclosed_shift
        logicalType: boolean
        physicalType: BOOLEAN
      - name: shift_seconds
        logicalType: integer
        physicalType: BIGINT
      - name: shift_date
        logicalType: date
        physicalType: DATE
      - name: reported_trip_count
        logicalType: integer
        physicalType: BIGINT
      - name: odometer_start
        logicalType: number
        physicalType: DOUBLE
      - name: odometer_end
        logicalType: number
        physicalType: DOUBLE
      - name: odometer_miles
        logicalType: number
        physicalType: DOUBLE
      - name: telematics_source
        logicalType: string
        physicalType: VARCHAR

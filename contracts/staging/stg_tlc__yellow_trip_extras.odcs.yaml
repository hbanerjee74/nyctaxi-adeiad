apiVersion: v3.2.0
kind: DataContract
id: c9336f5f-579c-53cc-8519-56d168574b9e
name: stg_tlc__yellow_trip_extras
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_tlc__yellow_trip_extras
    dataGranularityDescription: Yellow-only columns the conform step drops (ADR 0006), keyed back to the trip. Deduplicated to one row per natural key so the rejoin cannot multiply the fact.
    properties:
      - name: trip_key
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: airport_fee
        logicalType: number
        physicalType: DOUBLE
        description: 'Airport access fee as published. Dirty by nature: 1.75 current, zero on trips that incur none, negative on reversals, null where the vendor did not populate it.'
      - name: pickup_location_id
        logicalType: integer
        physicalType: INTEGER
      - name: pickup_datetime
        logicalType: timestamp
        physicalType: TIMESTAMP

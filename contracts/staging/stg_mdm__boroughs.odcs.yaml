apiVersion: v3.2.0
kind: DataContract
id: fde10d78-3749-53d8-b975-1c6bc8cd43e1
name: stg_mdm__boroughs
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_mdm__boroughs
    dataGranularityDescription: One row per borough.
    properties:
      - name: borough_name
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: borough_code
        logicalType: string
        physicalType: VARCHAR
      - name: reporting_region
        logicalType: string
        physicalType: VARCHAR
      - name: resident_population
        logicalType: integer
        physicalType: INTEGER
      - name: area_sq_mi
        logicalType: number
        physicalType: DECIMAL(5,2)
      - name: is_nyc
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_core_market
        logicalType: boolean
        physicalType: BOOLEAN

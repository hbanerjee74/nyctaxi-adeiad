apiVersion: v3.2.0
kind: DataContract
id: ef32080e-dffc-520c-ac7c-99149ee8ca59
name: stg_ops__status_events
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_ops__status_events
    dataGranularityDescription: The occupancy stream. `skew_seconds` exposes the gap between assigned and received time; sessionizing on the wrong one produces negative intervals.
    properties:
      - name: event_id
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: shift_id
        logicalType: string
        physicalType: VARCHAR
      - name: driver_id
        logicalType: integer
        physicalType: BIGINT
      - name: vehicle_id
        logicalType: integer
        physicalType: INTEGER
      - name: event_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: received_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
      - name: status_code
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: invalidValues
            arguments:
              valid_values:
                - LOGIN
                - AVAILABLE
                - DISPATCHED
                - ON_TRIP
                - BREAK
                - LOGOUT
            mustBe: 0
      - name: zone_id
        logicalType: integer
        physicalType: INTEGER
      - name: source_system
        logicalType: string
        physicalType: VARCHAR
      - name: skew_seconds
        logicalType: integer
        physicalType: BIGINT
      - name: is_occupied_status
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_available_status
        logicalType: boolean
        physicalType: BOOLEAN

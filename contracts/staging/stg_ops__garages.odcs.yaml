apiVersion: v3.2.0
kind: DataContract
id: c971f6ba-6059-5096-b074-b32c1be8d025
name: stg_ops__garages
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_ops__garages
    dataGranularityDescription: One row per garage.
    properties:
      - name: garage_id
        logicalType: integer
        physicalType: INTEGER
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: garage_name
        logicalType: string
        physicalType: VARCHAR
      - name: borough_name
        logicalType: string
        physicalType: VARCHAR
      - name: bay_capacity
        logicalType: integer
        physicalType: INTEGER
      - name: opened_date
        logicalType: date
        physicalType: DATE

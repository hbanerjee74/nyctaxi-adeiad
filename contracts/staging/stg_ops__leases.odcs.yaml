apiVersion: v3.2.0
kind: DataContract
id: 8c600ddd-2024-5778-919d-098985e7a514
name: stg_ops__leases
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_ops__leases
    dataGranularityDescription: One row per lease agreement.
    properties:
      - name: lease_id
        logicalType: integer
        physicalType: BIGINT
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: driver_id
        logicalType: integer
        physicalType: BIGINT
      - name: primary_vehicle_id
        logicalType: integer
        physicalType: BIGINT
      - name: lease_type
        logicalType: string
        physicalType: VARCHAR
      - name: lease_rate
        logicalType: number
        physicalType: DECIMAL(22,2)
      - name: revenue_share_pct
        logicalType: number
        physicalType: DECIMAL(3,2)
      - name: lease_start_date
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: lease_end_date
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true

apiVersion: v3.2.0
kind: DataContract
id: d7e4d593-218b-58c9-b9e5-17a1951019d9
name: stg_tlc__green_trip_extras
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_tlc__green_trip_extras
    dataGranularityDescription: Green-only columns, same reconstruction and dedup rule as yellow.
    properties:
      - name: trip_key
        logicalType: string
        physicalType: VARCHAR
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: ehail_fee
        logicalType: number
        physicalType: DOUBLE
      - name: trip_type
        logicalType: integer
        physicalType: BIGINT
      - name: pickup_datetime
        logicalType: timestamp
        physicalType: TIMESTAMP

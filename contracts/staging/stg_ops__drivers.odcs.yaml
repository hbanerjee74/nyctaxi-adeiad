apiVersion: v3.2.0
kind: DataContract
id: 30bf0af2-4760-5938-ba43-471dd9920090
name: stg_ops__drivers
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_ops__drivers
    dataGranularityDescription: One row per driver.
    properties:
      - name: driver_id
        logicalType: integer
        physicalType: BIGINT
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: hack_licence_no
        logicalType: string
        physicalType: VARCHAR
      - name: driver_ref
        logicalType: string
        physicalType: VARCHAR
      - name: engagement_type
        logicalType: string
        physicalType: VARCHAR
      - name: home_garage_id
        logicalType: integer
        physicalType: BIGINT
      - name: hire_date
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: termination_date
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: is_wav_certified
        logicalType: boolean
        physicalType: BOOLEAN
      - name: driver_status
        logicalType: string
        physicalType: VARCHAR

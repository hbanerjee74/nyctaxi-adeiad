apiVersion: v3.2.0
kind: DataContract
id: b77e1214-a3c0-58cc-b661-a07fba0c127c
name: stg_mdm__calendar
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: staging
schema:
  - name: stg_mdm__calendar
    dataGranularityDescription: One row per calendar date, with holiday, weekend and school-term flags.
    properties:
      - name: calendar_date
        logicalType: date
        physicalType: DATE
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: holiday_name
        logicalType: string
        physicalType: VARCHAR
      - name: holiday_class
        logicalType: string
        physicalType: VARCHAR
      - name: is_holiday
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_weekend
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_school_term
        logicalType: boolean
        physicalType: BOOLEAN

apiVersion: v3.2.0
kind: DataContract
id: 3fa52b31-93fd-5f25-824f-176c37a87fa4
name: mart_vehicle_utilisation
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: ops
schema:
  - name: mart_vehicle_utilisation
    dataGranularityDescription: Asset utilisation for the period with downtime netted out.
    properties:
      - name: vehicle_key
        logicalType: integer
        physicalType: BIGINT
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
          - type: library
            metric: nullValues
            mustBe: 0
      - name: medallion_number
        logicalType: string
        physicalType: VARCHAR
      - name: make_model
        logicalType: string
        physicalType: VARCHAR
      - name: model_year
        logicalType: integer
        physicalType: BIGINT
      - name: fuel_type
        logicalType: string
        physicalType: VARCHAR
      - name: is_low_emission
        logicalType: boolean
        physicalType: BOOLEAN
      - name: garage_key
        logicalType: integer
        physicalType: BIGINT
      - name: garage_name
        logicalType: string
        physicalType: VARCHAR
      - name: is_in_service
        logicalType: boolean
        physicalType: BOOLEAN
      - name: active_days
        logicalType: integer
        physicalType: HUGEINT
      - name: shift_count
        logicalType: integer
        physicalType: HUGEINT
      - name: trip_count
        logicalType: integer
        physicalType: HUGEINT
      - name: online_hours
        logicalType: number
        physicalType: DOUBLE
      - name: on_trip_hours
        logicalType: number
        physicalType: DOUBLE
      - name: gross_revenue
        logicalType: number
        physicalType: DOUBLE
      - name: paid_miles
        logicalType: number
        physicalType: DOUBLE
      - name: down_days
        logicalType: integer
        physicalType: HUGEINT
      - name: maintenance_cost
        logicalType: integer
        physicalType: HUGEINT
      - name: available_days
        logicalType: integer
        physicalType: HUGEINT
      - name: occupancy_rate
        logicalType: number
        physicalType: DOUBLE
      - name: availability_adjusted_rate
        logicalType: number
        physicalType: DOUBLE
      - name: revenue_per_online_hour
        logicalType: number
        physicalType: DOUBLE
      - name: net_revenue_per_active_day
        logicalType: number
        physicalType: DOUBLE

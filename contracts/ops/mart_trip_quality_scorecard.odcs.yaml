        logicalType: integer
        physicalType: BIGINT
      - name: non_billable_count
        logicalType: integer
        physicalType: BIGINT
      - name: refund_count
        logicalType: integer
        physicalType: BIGINT
      - name: zero_distance_count
        logicalType: integer
        physicalType: BIGINT
      - name: implausible_speed_count
        logicalType: integer
        physicalType: BIGINT
      - name: sparse_feed_count
        logicalType: integer
        physicalType: BIGINT
      - name: unresolved_zone_count
        logicalType: integer
        physicalType: BIGINT
      - name: undocumented_rate_count
        logicalType: integer
        physicalType: BIGINT
      - name: unbalanced_total_count
        logicalType: integer
        physicalType: BIGINT
      - name: clean_rate
        logicalType: number
        physicalType: DOUBLE
      - name: sparse_feed_rate
        logicalType: number
        physicalType: DOUBLE

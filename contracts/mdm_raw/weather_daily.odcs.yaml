apiVersion: v3.2.0
kind: DataContract
id: a0fcc702-f5f3-5a64-b5f7-32a4d8038792
name: weather_daily
version: 1.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: mdm_raw
schema:
  - name: weather_daily
    properties:
      - name: observation_id
        logicalType: string
        physicalType: VARCHAR
      - name: obs_date
        logicalType: date
        physicalType: DATE
      - name: borough_name
        logicalType: string
        physicalType: VARCHAR
      - name: temp_avg_f
        logicalType: number
        physicalType: DOUBLE
      - name: precip_inches
        logicalType: number
        physicalType: DOUBLE
      - name: snow_inches
        logicalType: number
        physicalType: DOUBLE
      - name: wind_mph
        logicalType: number
        physicalType: DOUBLE
      - name: _dlt_load_id
        logicalType: string
        physicalType: VARCHAR
        required: true
      - name: _dlt_id
        logicalType: string
        physicalType: VARCHAR
        required: true

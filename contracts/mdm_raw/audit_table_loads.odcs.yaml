apiVersion: v3.2.0
kind: DataContract
id: 1674e93d-782f-5827-b417-09656c957ecb
name: audit_table_loads
version: 1.0.2
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: mdm_raw
schema:
  - name: audit_table_loads
    properties:
      - name: load_id
        description: "dlt load identifier of the run; joins to audit_runs.load_id."
        logicalType: string
        physicalType: VARCHAR
      - name: table_name
        description: "Table the load wrote."
        logicalType: string
        physicalType: VARCHAR
      - name: rows_extracted
        description: "Rows the extract stage produced for the table."
        logicalType: integer
        physicalType: BIGINT
      - name: rows_normalized
        description: "Rows the normalize stage produced for the table."
        logicalType: integer
        physicalType: BIGINT
      - name: file_size
        description: "Size of the table's loaded file."
        logicalType: integer
        physicalType: BIGINT
      - name: load_state
        description: "State of the table's load."
        logicalType: string
        physicalType: VARCHAR
      - name: load_elapsed
        description: "Elapsed time of the table's load."
        logicalType: number
        physicalType: DOUBLE
description:
  purpose: Load audit relation, owned by the installed vibedata library. The loader writes its columns, so a change here follows a loader upgrade rather than a change in this repository's sources.

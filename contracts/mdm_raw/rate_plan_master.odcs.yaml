        logicalType: boolean
        physicalType: BOOLEAN
      - name: flat_fare_amount
        logicalType: number
        physicalType: DECIMAL(4,2)
      - name: is_airport_plan
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_metered_baseline
        logicalType: boolean
        physicalType: BOOLEAN
      - name: pricing_model
        logicalType: string
        physicalType: VARCHAR
      - name: _dlt_load_id
        logicalType: string
        physicalType: VARCHAR
        required: true
      - name: _dlt_id
        logicalType: string
        physicalType: VARCHAR
        required: true

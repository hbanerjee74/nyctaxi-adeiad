apiVersion: v3.2.0
kind: DataContract
id: a8472ce9-0d3a-56ed-b7a9-e56cea154444
name: rate_plan_master
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: mdm_raw
schema:
  - name: rate_plan_master
    properties:
      - name: rate_code
        description: "TLC rate code. Natural key of the rate plan."
        logicalType: integer
        physicalType: INTEGER
      - name: rate_plan_name
        description: "Name of the rate plan."
        logicalType: string
        physicalType: VARCHAR
      - name: is_flat_fare
        description: "True when the plan charges a flat fare."
        logicalType: boolean
        physicalType: BOOLEAN
      - name: flat_fare_amount
        description: "Flat fare amount, when the plan has one."
        logicalType: number
        physicalType: DECIMAL(4,2)
      - name: is_airport_plan
        description: "True when the plan is specific to an airport."
        logicalType: boolean
        physicalType: BOOLEAN
      - name: is_metered_baseline
        description: "True when the plan is a metered baseline."
        logicalType: boolean
        physicalType: BOOLEAN
      - name: pricing_model
        description: "How the plan prices a trip: meter, meter_plus, flat, negotiated or unknown."
        logicalType: string
        physicalType: VARCHAR

apiVersion: v3.2.0
kind: DataContract
id: 5efef523-a9cb-57e9-acc5-623aec5282ae
name: audit_runs
version: 2.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: ops_raw
schema:
  - name: audit_runs
    properties:
      - name: load_id
        description: "dlt load identifier of the run, a Unix-epoch timestamp held as text."
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
      - name: pipeline_name
        description: "Name of the dlt pipeline that ran."
        logicalType: string
        physicalType: VARCHAR
      - name: destination_name
        description: "dlt destination the run loaded into."
        logicalType: string
        physicalType: VARCHAR
      - name: dataset_name
        description: "Schema the run loaded into."
        logicalType: string
        physicalType: VARCHAR
      - name: first_run
        description: "Whether this was the pipeline's first run into the dataset."
        logicalType: boolean
        physicalType: BOOLEAN
      - name: status
        description: "Final status of the run."
        logicalType: string
        physicalType: VARCHAR
      - name: started_at
        description: "When the run started."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: finished_at
        description: "When the run finished."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: extract_started_at
        description: "When the extract stage started."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: extract_finished_at
        description: "When the extract stage finished."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: normalize_started_at
        description: "When the normalize stage started."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: normalize_finished_at
        description: "When the normalize stage finished."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: load_started_at
        description: "When the load stage started."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: load_finished_at
        description: "When the load stage finished."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: total_rows_extracted
        description: "Total rows the extract stage produced in the run."
        logicalType: integer
        physicalType: BIGINT
      - name: git_sha
        description: "Git commit sha of the repository when the run executed."
        logicalType: string
        physicalType: VARCHAR
description:
  purpose: Load audit relation, owned by the installed vibedata library. The loader writes its columns, so a change here follows a loader upgrade rather than a change in this repository's sources.

apiVersion: v3.2.0
kind: DataContract
id: feb14203-e499-529e-9014-24ea438fc15a
name: trip_assignment
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: ops_raw
schema:
  - name: trip_assignment
    properties:
      - name: assignment_id
        description: "Identifier of the trip assignment."
        logicalType: string
        physicalType: VARCHAR
      - name: service_type
        description: "Fleet of the trip. Always yellow: the operator runs yellow medallions."
        logicalType: string
        physicalType: VARCHAR
      - name: vendor_id
        description: "TLC vendor code of the trip."
        logicalType: integer
        physicalType: INTEGER
      - name: pickup_datetime
        description: "Pickup time of the trip."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: dropoff_datetime
        description: "Dropoff time of the trip."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: pickup_location_id
        description: "TLC pickup zone of the trip."
        logicalType: integer
        physicalType: INTEGER
      - name: dropoff_location_id
        description: "TLC dropoff zone of the trip."
        logicalType: integer
        physicalType: INTEGER
      - name: trip_distance
        description: "Trip distance in miles."
        logicalType: number
        physicalType: DOUBLE
      - name: total_amount
        description: "Total charged to the passenger."
        logicalType: number
        physicalType: DOUBLE
      - name: shift_id
        description: "Identifier of the shift."
        logicalType: string
        physicalType: VARCHAR
      - name: driver_id
        description: "Identifier of the driver."
        logicalType: integer
        physicalType: BIGINT
      - name: vehicle_id
        description: "Identifier of the vehicle."
        logicalType: integer
        physicalType: INTEGER
      - name: assigned_ts
        description: "When the trip was assigned to the shift."
        logicalType: timestamp
        physicalType: TIMESTAMP WITH TIME ZONE
        logicalTypeOptions:
          timezone: true
      - name: assignment_method
        description: "How the trip was assigned: auto or manual."
        logicalType: string
        physicalType: VARCHAR

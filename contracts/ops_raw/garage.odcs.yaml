apiVersion: v3.2.0
kind: DataContract
id: 110e58e9-1977-5b36-8ed1-5b550bc1a1ca
name: garage
version: 2.0.0
status: active
servers:
  - server: sample-nyctaxi-comp
    type: duckdb
    database: domain.duckdb
    schema: ops_raw
schema:
  - name: garage
    properties:
      - name: garage_id
        description: "Identifier of the garage."
        logicalType: integer
        physicalType: INTEGER
        primaryKey: true
      - name: garage_name
        description: "Name of the garage."
        logicalType: string
        physicalType: VARCHAR
      - name: borough
        description: "Borough the garage is in."
        logicalType: string
        physicalType: VARCHAR
      - name: bay_capacity
        description: "Number of vehicle bays."
        logicalType: integer
        physicalType: INTEGER
      - name: opened_date
        description: "Date the garage opened."
        logicalType: date
        physicalType: DATE

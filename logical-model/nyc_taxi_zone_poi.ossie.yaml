version: "0.2.0.dev0"
name: nyc_taxi_zone_poi
description: "Zone-to-point-of-interest allocation bridge. Standalone model: every join through it multiplies rows by design and carries an allocation factor for splitting a measure without double counting."
ai_context:
  instructions: Any measure joined through this bridge must be multiplied by allocation_factor, or it double counts across a zone's POIs.
  synonyms:
    - points of interest
    - POI allocation
datasets:
  - name: zone_poi
    source: core.bridge_zone_poi
    primary_key: [poi_id]
    description: One row per point of interest with its zone and the share of that zone's demand weight.
    fields:
      - name: poi_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_id
        datatype: String
        description: Point-of-interest identifier.
      - name: zone_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_natural_key
        datatype: Integer
        description: TLC location_id of the zone the POI sits in.
      - name: poi_category
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_category
        datatype: String
        description: Category code of the point of interest.
      - name: poi_category_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_category_name
        datatype: String
        description: Category label of the point of interest.
      - name: poi_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_name
        datatype: String
        description: Display name of the point of interest.
      - name: demand_weight
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: demand_weight
        datatype: Integer
        description: Raw demand weight of the POI within its zone.
      - name: allocation_factor
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: allocation_factor
        datatype: Float
        description: The POI's share of its zone's total demand weight; multiply an allocated measure by it.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.0", "logical_sources": [{"name": "LTS1_detail", "physical_table": "bridge_zone_poi", "priority_group": 1, "content_grain": ["poi"], "note": "Bridge semantics: fan-out by design; consumers must weight with allocation_factor. _core.yml tests poi_id unique while the model header calls it many-to-many, so cardinality into a star is undecided until a join key lands.", "column_map": {"poi_id": "poi_id", "zone_natural_key": "zone_natural_key", "poi_category": "poi_category", "poi_category_name": "poi_category_name", "poi_name": "poi_name", "demand_weight": "demand_weight", "allocation_factor": "allocation_factor"}}]}'
custom_extensions:
  - vendor_name: VIBEDATA
    data: '{"vibedata_version": "1.0", "physical_tables": [{"name": "bridge_zone_poi", "source": "core.bridge_zone_poi", "dbt_model": "bridge_zone_poi", "table_type": "TABLE", "note": "Standalone bridge: no join key into any star yet, and any join through it multiplies rows by design. Folds into the consuming star by S10 when a key lands."}], "physical_joins": []}'

version: "0.2.0.dev0"
name: nyc_taxi_zone_poi
description: "Point-of-interest allocation table: one row per zone and POI category. Standalone model — joining a zone-level measure through it fans out across the zone's POIs by design, and allocation_factor splits the measure so the parts sum back to the zone total."
ai_context:
  instructions: A zone-level measure joined through this table fans out across the zone's POI categories; multiply by allocation_factor or the parts double count.
  synonyms:
    - points of interest
    - POI allocation
datasets:
  - name: zone_poi
    source: core.bridge_zone_poi
    primary_key: [poi_id]
    description: One row per point of interest with its zone and the share of that zone's demand weight.
    fields:
      - name: poi_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_id
        datatype: String
        description: Point-of-interest identifier.
      - name: zone_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_natural_key
        datatype: Integer
        description: TLC location_id of the zone the POI sits in.
      - name: poi_category
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_category
        datatype: String
        description: Category code of the point of interest.
      - name: poi_category_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_category_name
        datatype: String
        description: Category label of the point of interest.
      - name: poi_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: poi_name
        datatype: String
        description: Display name of the point of interest.
      - name: demand_weight
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: demand_weight
        datatype: Integer
        description: Raw demand weight of the POI within its zone.
      - name: allocation_factor
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: allocation_factor
        datatype: Float
        description: The POI's share of its zone's total demand weight; multiply an allocated measure by it.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.3", "logical_sources": [{"name": "LTS1_detail", "physical_table": "bridge_zone_poi", "priority_group": 1, "content_grain": ["poi"], "note": "One row per (zone, POI category), so zone to POI is one-to-many, not many-to-many; a zone-level measure fans out across categories and must be weighted by allocation_factor. No join key into a star yet; folds in by S10 when one lands.", "column_map": {"poi_id": "poi_id", "zone_natural_key": "zone_natural_key", "poi_category": "poi_category", "poi_category_name": "poi_category_name", "poi_name": "poi_name", "demand_weight": "demand_weight", "allocation_factor": "allocation_factor"}}]}'
custom_extensions:
  - vendor_name: VIBEDATA
    data: '{"vibedata_version": "1.3", "physical_tables": [{"name": "bridge_zone_poi", "source": "core.bridge_zone_poi", "dbt_model": "bridge_zone_poi", "table_type": "TABLE", "note": "Standalone bridge: no join key into any star yet, and any join through it multiplies rows by design. Folds into the consuming star by S10 when a key lands."}], "physical_joins": []}'

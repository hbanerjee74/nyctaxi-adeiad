metrics:
  - name: trip_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.trip_key IS NOT NULL THEN 1 ELSE 0 END)
    description: Trips, billable or not.
    datatype: Integer
    ai_context:
      synonyms:
        - Trips
  - name: billable_trip_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN 1 ELSE 0 END)
    description: Trips whose total amount is positive.
    datatype: Integer
    ai_context:
      synonyms:
        - Billable trips
  - name: billable_revenue
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN trips.is_billable THEN trips.total_amount ELSE 0 END)
    description: Total amount charged on billable trips. Excludes cash tips.
    datatype: Decimal
    ai_context:
      synonyms:
        - Billable revenue
  - name: fare_residual_total
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(trips.fare_residual)
    description: Trip total minus every modelled fare component, summed.
    datatype: Decimal
    ai_context:
      synonyms:
        - Fare residual

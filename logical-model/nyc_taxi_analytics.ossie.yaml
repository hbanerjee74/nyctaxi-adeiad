version: "0.2.0.dev0"
name: nyc_taxi_trips
description: One row per TLC trip (yellow + green, 2024-01 to 2024-03) with billable flag, fleet attribution, and conformed dimensions. Trips star of the nyc-taxi-duckdb-demo warehouse.
ai_context:
  instructions: Use for trip-level revenue and demand analysis inside the report window (ADR 0003). Billable math must filter on is_billable; green trips never carry airport_fee.
  synonyms:
    - yellow and green taxi trips
    - TLC trips
datasets:
  - name: trips
    source: core.fct_trip
    primary_key: [trip_key]
    description: One row per TLC trip. The grain of the warehouse.
    ai_context:
      synonyms:
        - trips
        - rides
    fields:
      - name: trip_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_key
        datatype: String
        description: Natural key from the trip_natural_key macro.
      - name: pickup_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_date
        datatype: Date
        dimension:
          is_time: true
        description: Calendar date of pickup; report window grain is day.
      - name: pickup_date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_date_key
        datatype: Integer
        description: Surrogate key into date for the pickup date.
      - name: pickup_hour
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_hour
        datatype: Integer
        description: Hour of day of pickup (0-23), joins dim_daypart.
      - name: daypart_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: daypart_code
        datatype: String
        description: Analyst-owned daypart band for pickup_hour.
      - name: service_type_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: service_type_key
        datatype: String
        description: Fleet service type of the trip.
      - name: pickup_zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pickup_zone_key
        datatype: String
        description: Origin zone surrogate, resolved as of the trip date (Pickup_Zone role).
      - name: dropoff_zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: dropoff_zone_key
        datatype: String
        description: Destination zone surrogate, resolved as of the trip date (Dropoff_Zone role).
      - name: vendor_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vendor_key
        datatype: String
        description: Vendor surrogate, resolved as of the trip date.
      - name: payment_method_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: payment_method_key
        datatype: Integer
        description: How the trip settled.
      - name: rate_plan_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: rate_plan_key
        datatype: Integer
        description: Rate plan in effect for the trip.
      - name: trip_quality_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_quality_key
        datatype: String
        description: Junk-dimension key over the observed quality verdicts.
      - name: is_billable
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_billable
        datatype: Boolean
        description: Total amount is positive (ADR 0003). Null handling per ADR.
      - name: is_fleet_attributed
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_fleet_attributed
        datatype: Boolean
        description: True when Harbour Point operated the trip; null driver/vehicle/shift otherwise.
      - name: airport_fee_status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: airport_fee_status
        datatype: String
        description: Yellow only; null for every green trip by construction.
      - name: total_amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: total_amount
        datatype: Decimal
        description: Total amount charged, row level. Aggregate only through metrics.
      - name: fare_residual
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: fare_residual
        datatype: Decimal
        description: Trip total minus every modelled fare component, row level.
      - name: shift_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_id
        datatype: String
        description: Attributed fleet shift; null for non-fleet trips.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_detail", "physical_table": "fct_trip", "priority_group": 1, "content_grain": ["trip"], "column_map": {"trip_key": "trip_key", "pickup_date_key": "pickup_date_key", "pickup_date": "pickup_date", "pickup_hour": "pickup_hour", "daypart_code": "daypart_code", "service_type_key": "service_type_key", "pickup_zone_key": "pickup_zone_key", "dropoff_zone_key": "dropoff_zone_key", "vendor_key": "vendor_key", "payment_method_key": "payment_method_key", "rate_plan_key": "rate_plan_key", "trip_quality_key": "trip_quality_key", "is_billable": "is_billable", "is_fleet_attributed": "is_fleet_attributed", "airport_fee_status": "airport_fee_status", "total_amount": "total_amount", "fare_residual": "fare_residual", "shift_id": "shift_id", "fare_residual_total": "fare_residual"}}, {"name": "LTS2_zone_day_agg", "physical_table": "agg_trip_zone_daily", "priority_group": 0, "content_grain": ["pickup_date", "pickup_location_id"], "note": "trip_count checked against agg_trip_zone_daily.sql: count(*) over in-window trips, the same aggregation as the metric", "column_map": {"pickup_date": "pickup_date", "trip_count": "trip_count"}}, {"name": "LTS3_zone_daypart_dow", "physical_table": "agg_trip_zone_daypart_dow", "priority_group": 0, "content_grain": ["pickup_location_id", "day_of_week", "is_non_working_day", "daypart_code", "is_peak", "service_type_key"], "note": "trip_count checked: count(*) unfiltered; billable_trip_count checked: count(*) filter (where f.is_billable), the same aggregation as the metric", "column_map": {"service_type_key": "service_type_key", "daypart_code": "daypart_code", "trip_count": "trip_count", "billable_trip_count": "billable_trip_count"}}, {"name": "LTS4_band_profile", "physical_table": "agg_trip_band_profile", "priority_group": 0, "content_grain": ["distance_band", "duration_band", "fare_band", "service_type_key", "pickup_borough", "daypart_code"], "note": "reconciliation held by assert_band_profile_covers_every_trip; the joins that define this population live in the mart SQL", "column_map": {"service_type_key": "service_type_key", "daypart_code": "daypart_code", "trip_count": "trip_count"}}, {"name": "LTS5_weather_borough_daily", "physical_table": "agg_weather_demand_daily", "priority_group": 0, "content_grain": ["obs_date", "borough_name"], "note": "reconciliation held by assert_weather_profile_covers_every_trip; the spine and as-of attribution that define this population live in the mart SQL (ADR 0009)", "column_map": {"pickup_date": "obs_date", "trip_count": "trip_count"}}, {"name": "LTS6_od_flow", "physical_table": "agg_od_flow_matrix", "priority_group": 0, "content_grain": ["origin_location_id", "dest_location_id"], "note": "answers the population ADR 0017 defines; a whole-network question comes from the detail source", "column_map": {"billable_trip_count": "trip_count", "billable_revenue": "total_revenue"}}, {"name": "LTS7_daily_zone_revenue", "physical_table": "mart_daily_zone_revenue", "priority_group": 0, "content_grain": ["trip_date", "pickup_location_id"], "note": "Refused: trip_count (the mart applies f.is_billable, so its trip_count is the billable count); pickup_zone_key (the mart carries zone_natural_key as pickup_location_id, not the zone surrogate); fare_residual_total and total_amount (no residual or row-level total column survives the group by); fare, tip, surcharge and toll revenue (no metric declared).", "column_map": {"pickup_date": "trip_date", "billable_trip_count": "trip_count", "billable_revenue": "total_revenue"}}, {"name": "LTS8_monthly_service_summary", "physical_table": "mart_monthly_service_summary", "priority_group": 0, "content_grain": ["trip_month", "service_type", "payment_method_name"], "note": "Refused: pickup_date (month grain only); trip_count (the mart applies f.is_billable); payment_method_key (the mart carries payment_method_name, not the key); total_miles, avg_fare and est_processor_fees (no metric declared).", "column_map": {"service_type_key": "service_type", "billable_trip_count": "trip_count", "billable_revenue": "total_revenue"}}, {"name": "LTS9_trip_quality_scorecard", "physical_table": "mart_trip_quality_scorecard", "priority_group": 0, "content_grain": ["trip_month", "vendor_id", "service_type_key"], "note": "Refused: billable_trip_count (the mart only carries non_billable_count; billable is the difference, not a column, so the map would be an expression the model does not have); vendor_key (the mart carries vendor_natural_key as vendor_id); pickup_date (month grain only); clean, non-billable, refund, zero-distance, implausible-speed, sparse-feed, unresolved-zone, undocumented-rate, unbalanced-total counts and the two rates (no metric declared).", "column_map": {"service_type_key": "service_type_key", "trip_count": "trip_count"}}]}'
  - name: date
    source: core.dim_date
    primary_key: [date_key]
    description: Date spine with holiday, weekend, and school-term flags from master data.
    fields:
      - name: date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date_key
        datatype: Integer
        description: yyyymmdd integer key.
      - name: calendar_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_date
        datatype: Date
        dimension:
          is_time: true
        description: Calendar date.
      - name: calendar_year
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_year
        datatype: Integer
        dimension:
          is_time: true
        description: Calendar year grain.
      - name: calendar_quarter
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_quarter
        datatype: Integer
        dimension:
          is_time: true
        description: Calendar quarter grain (1-4).
      - name: calendar_month
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: calendar_month
        datatype: Integer
        dimension:
          is_time: true
        description: Calendar month grain (1-12).
      - name: month_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: month_name
        datatype: String
        dimension:
          is_time: true
        description: Month label for the month grain.
      - name: is_weekend
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_weekend
        datatype: Boolean
        description: Saturday or Sunday.
      - name: is_holiday
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_holiday
        datatype: Boolean
        description: Master-data holiday flag; corrections restate reports without code change.
      - name: is_non_working_day
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_non_working_day
        datatype: Boolean
        description: Weekend or holiday; weekday holidays behave like weekends for demand.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_calendar", "physical_table": "dim_date", "priority_group": 1, "content_grain": ["calendar_date"], "column_map": {"date_key": "date_key", "calendar_date": "calendar_date", "calendar_year": "calendar_year", "calendar_quarter": "calendar_quarter", "calendar_month": "calendar_month", "month_name": "month_name", "is_weekend": "is_weekend", "is_holiday": "is_holiday", "is_non_working_day": "is_non_working_day"}}], "hierarchies": [{"name": "Time", "levels": ["calendar_year", "calendar_quarter", "calendar_month", "calendar_date"]}]}'
  - name: zone
    source: core.dim_zone
    primary_key: [zone_key]
    description: Type 2 zone dimension, natural key location_id, versioned by master data.
    ai_context:
      synonyms:
        - pickup zone
        - dropoff zone
        - taxi zone
    fields:
      - name: zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_key
        datatype: String
        description: Surrogate over natural key plus valid-from date.
      - name: zone_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_natural_key
        datatype: Integer
        description: TLC location_id.
      - name: zone_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_name
        datatype: String
        description: Zone display name.
      - name: borough_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: borough_name
        datatype: String
        description: Borough, including Unknown and N/A for unresolved zones.
      - name: reporting_region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: reporting_region
        datatype: String
        description: Reporting region above borough.
      - name: valid_from_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_from_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity start for the as-of join. Audit column, not a time dimension.
      - name: valid_to_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_to_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity end; 2099-12-31 marks the current version.
      - name: is_current_version
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_current_version
        datatype: Boolean
        description: True for the current version of each zone.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "scd": {"type": 2, "natural_key": "zone_natural_key", "valid_from": "valid_from_date", "valid_to": "valid_to_date", "is_current": "is_current_version", "open_ended_value": "2099-12-31"}, "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_zone", "priority_group": 1, "content_grain": ["zone"], "column_map": {"zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "zone_name": "zone_name", "borough_name": "borough_name", "reporting_region": "reporting_region", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}, {"name": "LTS2_pickup_role", "physical_table": "Pickup_Zone", "priority_group": 1, "content_grain": ["zone"], "column_map": {"zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "zone_name": "zone_name", "borough_name": "borough_name", "reporting_region": "reporting_region", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}, {"name": "LTS3_dropoff_role", "physical_table": "Dropoff_Zone", "priority_group": 1, "content_grain": ["zone"], "column_map": {"zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "zone_name": "zone_name", "borough_name": "borough_name", "reporting_region": "reporting_region", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}], "hierarchies": [{"name": "Geography", "levels": ["reporting_region", "borough_name", "zone_name"]}]}'
  - name: vendor
    source: core.dim_vendor
    primary_key: [vendor_key]
    description: Type 2 vendor dimension, natural key vendor_id.
    fields:
      - name: vendor_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vendor_key
        datatype: String
        description: Surrogate over natural key plus valid-from date.
      - name: vendor_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vendor_natural_key
        datatype: String
        description: Source vendor identifier.
      - name: valid_from_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_from_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity start for the as-of join.
      - name: valid_to_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: valid_to_date
        datatype: Date
        dimension:
          is_time: false
        description: Half-open validity end.
      - name: is_current_version
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_current_version
        datatype: Boolean
        description: True for the current version of each vendor.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "scd": {"type": 2, "natural_key": "vendor_natural_key", "valid_from": "valid_from_date", "valid_to": "valid_to_date", "is_current": "is_current_version", "open_ended_value": "2099-12-31"}, "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_vendor", "priority_group": 1, "content_grain": ["vendor"], "column_map": {"vendor_key": "vendor_key", "vendor_natural_key": "vendor_natural_key", "valid_from_date": "valid_from_date", "valid_to_date": "valid_to_date", "is_current_version": "is_current_version"}}]}'
  - name: payment_method
    source: core.dim_payment_method
    primary_key: [payment_method_key]
    description: "One row per payment method: settlement, tip capture, and revenue eligibility."
    fields:
      - name: payment_method_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: payment_method_key
        datatype: Integer
        description: Payment type code.
      - name: tip_is_captured
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: tip_is_captured
        datatype: Boolean
        description: Whether trips paid this way record tips.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_payment_method", "priority_group": 1, "content_grain": ["payment_method"], "column_map": {"payment_method_key": "payment_method_key", "tip_is_captured": "tip_is_captured"}}]}'
  - name: trip_quality
    source: core.dim_trip_quality
    primary_key: [trip_quality_key]
    description: Junk dimension over the observed combinations of trip quality verdicts.
    fields:
      - name: trip_quality_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_quality_key
        datatype: String
        description: Key over the observed verdict combination.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_trip_quality", "priority_group": 1, "content_grain": ["trip_quality"], "column_map": {"trip_quality_key": "trip_quality_key"}}]}'
  - name: daypart
    source: core.dim_daypart
    primary_key: [hour_of_day]
    description: One row per hour of the day, with its analyst-owned daypart band and peak flag.
    fields:
      - name: hour_of_day
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: hour_of_day
        datatype: Integer
        description: Hour of day (0-23); joins trips on pickup_hour.
      - name: daypart_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: daypart_code
        datatype: String
        description: "Daypart band code from the daypart seed: LATE, EARLY, MID, AMPEAK, PMPEAK or EVE."
      - name: daypart_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: daypart_name
        datatype: String
        description: Daypart label for the band.
      - name: is_peak
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_peak
        datatype: Boolean
        description: Whether the hour is a peak hour in the seed's daypart bands.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_daypart", "priority_group": 1, "content_grain": ["daypart"], "column_map": {"hour_of_day": "hour_of_day", "daypart_code": "daypart_code", "daypart_name": "daypart_name", "is_peak": "is_peak"}}], "hierarchies": [{"name": "Daypart", "levels": ["daypart_code", "hour_of_day"]}]}'
  - name: rate_plan
    source: core.dim_rate_plan
    primary_key: [rate_plan_key]
    description: One row per rate plan, with its pricing model and flat-fare terms from master data.
    fields:
      - name: rate_plan_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: rate_plan_key
        datatype: Integer
        description: Source rate code (rate_code_id).
      - name: rate_plan_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: rate_plan_name
        datatype: String
        description: Rate plan display name.
      - name: pricing_model
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: pricing_model
        datatype: String
        description: Pricing basis the plan charges on.
      - name: is_flat_fare
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_flat_fare
        datatype: Boolean
        description: True when the plan charges a flat amount rather than the meter.
      - name: flat_fare_amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: flat_fare_amount
        datatype: Decimal
        description: Flat amount charged under the plan; null for metered plans.
      - name: is_airport_plan
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_airport_plan
        datatype: Boolean
        description: True for the airport flat-fare plans.
      - name: is_metered_baseline
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_metered_baseline
        datatype: Boolean
        description: True for the standard metered plan every other plan is compared against.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_rate_plan", "priority_group": 1, "content_grain": ["rate_plan"], "column_map": {"rate_plan_key": "rate_plan_key", "rate_plan_name": "rate_plan_name", "pricing_model": "pricing_model", "is_flat_fare": "is_flat_fare", "flat_fare_amount": "flat_fare_amount", "is_airport_plan": "is_airport_plan", "is_metered_baseline": "is_metered_baseline"}}]}'
  - name: service_type
    source: core.dim_service_type
    primary_key: [service_type_key]
    description: One row per fleet service type, with its hail and airport rules.
    fields:
      - name: service_type_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: service_type_key
        datatype: String
        description: yellow or green; the fact carries the same value.
      - name: service_type_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: service_type_name
        datatype: String
        description: Service type display name.
      - name: may_serve_airports
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: may_serve_airports
        datatype: Boolean
        description: True when the fleet may pick up at the airports.
      - name: may_serve_manhattan_core
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: may_serve_manhattan_core
        datatype: Boolean
        description: True when the fleet may street-hail inside the Manhattan core.
      - name: hail_rule
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: hail_rule
        datatype: String
        description: Where the fleet may street-hail, in words.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.1", "logical_sources": [{"name": "LTS1_base", "physical_table": "dim_service_type", "priority_group": 1, "content_grain": ["service_type"], "column_map": {"service_type_key": "service_type_key", "service_type_name": "service_type_name", "may_serve_airports": "may_serve_airports", "may_serve_manhattan_core": "may_serve_manhattan_core", "hail_rule": "hail_rule"}}]}'
relationships:
  - name: trips_to_pickup_zone
    from: trips
    to: zone
    from_columns: [pickup_zone_key]
    to_columns: [zone_key]
    ai_context:
      synonyms:
        - origin zone
        - where the trip started
    custom_extensions:
      - vendor_name: VIBEDATA

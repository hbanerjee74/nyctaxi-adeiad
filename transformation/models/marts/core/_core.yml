version: 2

models:
  - name: dim_date
    description: Date spine with holiday, weekend, and school-term flags from master data.
    contract: {enforced: true}
    columns:
      - name: date_key
        data_type: INTEGER
        data_tests: [unique, not_null]
        description: yyyymmdd integer key.
      - name: calendar_date
        data_type: DATE
        data_tests: [unique, not_null]
        description: Calendar date.
      - name: calendar_year
        data_type: BIGINT
        description: Calendar year grain.
      - name: calendar_quarter
        data_type: BIGINT
        description: Calendar quarter grain (1-4).
      - name: calendar_month
        data_type: BIGINT
        description: Calendar month grain (1-12).
      - name: month_name
        data_type: VARCHAR
        description: Month label for the month grain.
      - name: iso_week
        data_type: BIGINT
      - name: month_start_date
        data_type: TIMESTAMP
        description: First day of the calendar month; key of the month level, since calendar_month repeats every year.
      - name: week_start_date
        data_type: TIMESTAMP
        description: Monday that starts the calendar week (ADR 0014); key of the week level.
      - name: day_of_week
        data_type: BIGINT
      - name: day_name
        data_type: VARCHAR
      - name: is_weekend
        data_type: BOOLEAN
        description: Saturday or Sunday.
      - name: is_holiday
        data_type: BOOLEAN
        description: Master-data holiday flag; corrections restate reports without code change.
      - name: holiday_name
        data_type: VARCHAR
      - name: holiday_class
        data_type: VARCHAR
      - name: is_school_term
        data_type: BOOLEAN
      - name: is_non_working_day
        data_type: BOOLEAN
        description: Weekend or holiday; weekday holidays behave like weekends for demand.
  - name: dim_daypart
    description: One row per hour of the day, with its analyst-owned daypart band and peak flag.
    contract: {enforced: true}
    columns:
      - name: hour_of_day
        data_type: INTEGER
        data_tests: [unique, not_null]
        description: Hour of day (0-23); joins trips on pickup_hour.
      - name: daypart_code
        data_type: VARCHAR
        description: 'Daypart band code from the daypart seed: LATE, EARLY, MID, AMPEAK, PMPEAK or EVE.'
      - name: daypart_name
        data_type: VARCHAR
        description: Daypart label for the band.
      - name: is_peak
        data_type: BOOLEAN
        description: Whether the hour is a peak hour in the seed's daypart bands.
  - name: dim_zone
    description: |
      Type 2 zone dimension, natural key `location_id`.
      {{ doc("scd2_asof") }}
    contract: {enforced: true}
    columns:
      - name: zone_key
        description: Surrogate over natural key plus valid-from date.
        data_type: VARCHAR
        data_tests: [unique, not_null]
      - name: zone_natural_key
        data_type: BIGINT
        data_tests: [not_null]
        description: TLC location_id.
      - name: is_current_version
        data_type: BOOLEAN
        data_tests: [not_null]
        description: True for the current version of each zone.
      - name: borough_name
        data_type: VARCHAR
        data_tests: [{accepted_values: {arguments: {values: [Manhattan, Brooklyn, Queens, Bronx, Staten Island, EWR, Unknown, N/A]}}}]
        description: Borough, including Unknown and N/A for unresolved zones.
      - name: zone_version
        data_type: INTEGER
      - name: valid_from_date
        data_type: DATE
        description: Half-open validity start for the as-of join. Audit column, not a time dimension.
      - name: valid_to_date
        data_type: DATE
        description: Half-open validity end; 2099-12-31 marks the current version.
      - name: zone_name
        data_type: VARCHAR
        description: Zone display name.
      - name: borough_code
        data_type: VARCHAR
      - name: reporting_region
        data_type: VARCHAR
        description: Reporting region above borough.
      - name: tlc_service_zone
        data_type: VARCHAR
      - name: zone_class
        data_type: VARCHAR
      - name: demand_tier
        data_type: VARCHAR
      - name: centroid_lat
        data_type: DOUBLE
      - name: centroid_lon
        data_type: DOUBLE
      - name: area_sq_mi
        data_type: DOUBLE
      - name: resident_population
        data_type: BIGINT
      - name: is_airport_zone
        data_type: BOOLEAN
      - name: is_congestion_zone
        data_type: BOOLEAN
      - name: is_nyc
        data_type: BOOLEAN
      - name: is_core_market
        data_type: BOOLEAN
      - name: is_unresolved_zone
        data_type: BOOLEAN
      - name: poi_count
        data_type: BIGINT
      - name: poi_categories
        data_type: VARCHAR
  - name: dim_vendor
    description: |
      Type 2 vendor dimension, natural key `vendor_id`. VendorID 2 carries two
      versions across the July 2023 Curb Mobility rebrand.
      {{ doc("scd2_asof") }}
    contract: {enforced: true}
    columns:
      - name: vendor_key
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Surrogate over natural key plus valid-from date.
      - name: vendor_natural_key
        data_type: INTEGER
        data_tests: [not_null]
        description: Source vendor identifier.
      - name: vendor_version
        data_type: INTEGER
      - name: valid_from_date
        data_type: DATE
        description: Half-open validity start for the as-of join.
      - name: valid_to_date
        data_type: DATE
        description: Half-open validity end.
      - name: is_current_version
        data_type: BOOLEAN
        description: True for the current version of each vendor.
      - name: vendor_legal_name
        data_type: VARCHAR
      - name: vendor_short_code
        data_type: VARCHAR
      - name: contract_tier
        data_type: VARCHAR
      - name: is_approved
        data_type: BOOLEAN
  - name: dim_payment_method
    description: 'One row per payment method: settlement, tip capture, and revenue eligibility.'
    contract: {enforced: true}
    columns:
      - name: payment_method_key
        data_type: INTEGER
        data_tests: [unique, not_null]
        description: Payment type code.
      - name: tip_is_captured
        description: '{{ doc("measurable_tip_rate") }}'
        data_type: BOOLEAN
        data_tests: [not_null]
      - name: payment_method_name
        data_type: VARCHAR
        description: Name of the payment method; its display key, as the finance marts carry it.
      - name: settlement_class
        data_type: VARCHAR
      - name: settlement_days
        data_type: INTEGER
      - name: processor_fee_pct
        data_type: DECIMAL(5,4)
      - name: counts_as_revenue
        data_type: BOOLEAN
  - name: dim_rate_plan
    description: One row per rate plan, with its pricing model and flat-fare terms from master data.
    contract: {enforced: true}
    columns:
      - name: rate_plan_key
        data_type: INTEGER
        data_tests: [unique, not_null]
        description: Source rate code (rate_code_id).
      - name: rate_plan_name
        data_type: VARCHAR
        description: Rate plan display name.
      - name: pricing_model
        data_type: VARCHAR
        description: Pricing basis the plan charges on.
      - name: is_flat_fare
        data_type: BOOLEAN
        description: True when the plan charges a flat amount rather than the meter.
      - name: flat_fare_amount
        data_type: DECIMAL(4,2)
        description: Flat amount charged under the plan; null for metered plans.
      - name: is_airport_plan
        data_type: BOOLEAN
        description: True for the airport flat-fare plans.
      - name: is_metered_baseline
        data_type: BOOLEAN
        description: True for the standard metered plan every other plan is compared against.
  - name: dim_service_type
    description: One row per fleet service type, with its hail and airport rules.
    contract: {enforced: true}
    columns:
      - name: service_type_key
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: yellow or green; the fact carries the same value.
      - name: service_type_name
        data_type: VARCHAR
        description: Service type display name.
      - name: may_serve_airports
        data_type: BOOLEAN
        description: True when the fleet may pick up at the airports.
      - name: may_serve_manhattan_core
        data_type: BOOLEAN
        description: True when the fleet may street-hail inside the Manhattan core.
      - name: hail_rule
        data_type: VARCHAR
        description: Where the fleet may street-hail, in words.
  - name: dim_fare_regime
    description: Effective-dated surcharge rates, joined on component and date.
    contract: {enforced: true}
    columns:
      - name: fare_regime_key
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Regime code identifying the surcharge regime.
      - name: fare_component
        data_type: VARCHAR
        description: The fare component the rate applies to (mta_tax, improvement_surcharge, congestion_surcharge, airport_fee).
      - name: rate_amount
        data_type: DECIMAL(3,2)
        description: Surcharge amount in effect for the interval.
      - name: applies_to_fleet
        data_type: VARCHAR
        description: Whether the regime applies to the fleet service types.
      - name: valid_from_date
        data_type: DATE
        description: Half-open validity start.
      - name: valid_to_date
        data_type: DATE
        description: Half-open validity end; 2099-12-31 marks the current version.
      - name: is_current_regime
        data_type: BOOLEAN
        description: True for the current version of each regime.
  - name: dim_driver
    description: Type 1 driver dimension — current state with lease and home garage. The operator keeps no driver history, so a Type 2 here would fabricate it.
    contract: {enforced: true}
    columns:
      - name: driver_key
        data_type: BIGINT
        data_tests: [unique, not_null]
        description: Operator's driver identifier.
      - name: garage_key
        data_type: BIGINT
        data_tests: [{relationships: {arguments: {field: garage_key, to: ref('dim_garage')}}}]
        description: Driver's home garage.
      - name: hack_licence_no
        data_type: VARCHAR
      - name: driver_ref
        data_type: VARCHAR
        description: Short driver reference used in reports.
      - name: engagement_type
        data_type: VARCHAR
        description: How the driver is engaged (employee, contractor, ...).
      - name: driver_status
        data_type: VARCHAR
        description: Current activation status of the driver.
      - name: is_wav_certified
        data_type: BOOLEAN
        description: Certified to drive a wheelchair-accessible vehicle.
      - name: hire_date
        data_type: TIMESTAMP WITH TIME ZONE
        description: Date engagement started; an attribute of the driver, not a time dimension.
      - name: termination_date
        data_type: TIMESTAMP WITH TIME ZONE
        description: Date engagement ended; null while active.
      - name: tenure_days
        data_type: BIGINT
        description: Days from hire to the report end; restates with the reporting window.
      - name: home_garage_name
        data_type: VARCHAR
        description: Display name of the driver's home garage.
      - name: lease_id
        data_type: BIGINT
      - name: lease_type
        data_type: VARCHAR
        description: Current lease arrangement, null when the driver is not on a lease.
      - name: lease_rate
        data_type: DECIMAL(22,2)
        description: Current lease rate charged to the driver.
      - name: revenue_share_pct
        data_type: DECIMAL(3,2)
        description: Share of revenue retained under the current lease.
      - name: primary_vehicle_id
        data_type: BIGINT
  - name: dim_vehicle
    description: Type 1 vehicle dimension with maintenance downtime folded in, so a vehicle out of the shop is not read as an underperforming asset.
    contract: {enforced: true}
    columns:
      - name: vehicle_key
        data_type: BIGINT
        data_tests: [unique, not_null]
        description: Operator's vehicle identifier.
      - name: medallion_number
        data_type: VARCHAR
        data_tests: [not_null]
        description: Medallion the vehicle operates under.
      - name: vin
        data_type: VARCHAR
      - name: make
        data_type: VARCHAR
      - name: model
        data_type: VARCHAR
      - name: make_model
        data_type: VARCHAR
        description: Reporting label for make and model.
      - name: model_year
        data_type: BIGINT
        description: Model year of the vehicle.
      - name: vehicle_age_years
        data_type: BIGINT
        description: Model age in years at the report end; restates with the reporting window.
      - name: fuel_type
        data_type: VARCHAR
        description: Fuel or drivetrain type.
      - name: is_low_emission
        data_type: BOOLEAN
        description: Hybrid or electric.
      - name: wheelchair_accessible
        data_type: BOOLEAN
        description: Equipped for wheelchair access.
      - name: garage_key
        data_type: BIGINT
        description: Garage the vehicle is assigned to; not the driver's home garage.
      - name: garage_name
        data_type: VARCHAR
        description: Display name of the assigned garage.
      - name: in_service_date
        data_type: TIMESTAMP WITH TIME ZONE
        description: Date the vehicle entered service.
      - name: retired_date
        data_type: TIMESTAMP WITH TIME ZONE
        description: Date the vehicle left service; null while in service.
      - name: is_in_service
        data_type: BOOLEAN
        description: True while the vehicle is available to the fleet.
      - name: maintenance_events
        data_type: BIGINT
        description: Lifetime count of maintenance events.
      - name: maintenance_down_days
        data_type: HUGEINT
        description: Lifetime down-days across maintenance events; semi-additive.
      - name: maintenance_cost_usd
        data_type: HUGEINT
        description: Lifetime maintenance cost in USD.
  - name: dim_garage
    description: One row per garage with its capacity and the vehicles assigned to it.
    contract: {enforced: true}
    columns:
      - name: garage_key
        data_type: INTEGER
        data_tests: [unique, not_null]
        description: Garage identifier.
      - name: garage_name
        data_type: VARCHAR
        description: Garage display name.
      - name: borough_name
        data_type: VARCHAR
        description: Borough the garage sits in.
      - name: bay_capacity
        data_type: INTEGER
        description: Number of bays available for vehicles.
      - name: opened_date
        data_type: DATE
        description: Date the garage opened.
      - name: assigned_vehicle_count
        data_type: BIGINT
        description: Vehicles currently assigned to the garage.
  - name: dim_trip_quality
    description: Junk dimension over the observed combinations of trip quality verdicts. Only combinations that occur are materialised, not the 4096-row cross product (ADR 0004).
    contract: {enforced: true}
    columns:
      - name: trip_quality_key
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Key over the observed verdict combination.
      - name: is_billable
        data_type: BOOLEAN
      - name: is_refund
        data_type: BOOLEAN
      - name: is_zero_distance
        data_type: BOOLEAN
      - name: is_implausibly_short
        data_type: BOOLEAN
      - name: is_implausibly_fast
        data_type: BOOLEAN
      - name: is_negative_duration
        data_type: BOOLEAN
      - name: is_zero_passenger
        data_type: BOOLEAN
      - name: is_missing_passenger_count
        data_type: BOOLEAN
      - name: is_sparse_vendor_feed
        data_type: BOOLEAN
      - name: is_unresolved_pickup_zone
        data_type: BOOLEAN
      - name: is_undocumented_rate_code
        data_type: BOOLEAN
      - name: is_missing_airport_fee
        data_type: BOOLEAN
      - name: is_clean_trip
        data_type: BOOLEAN
  - name: bridge_zone_poi
    description: One row per point of interest with its zone and the share of that zone's demand weight. Zone to POI is one-to-many, so a zone-level measure fans out across categories; it is allocated by the weight, never repeated.
    contract: {enforced: true}
    columns:
      - name: poi_id
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Point-of-interest identifier.
      - name: zone_natural_key
        data_type: BIGINT
        description: TLC location_id of the zone the POI sits in.
        data_tests: [{relationships: {arguments: {field: zone_natural_key, to: ref('dim_zone')}}}]
      - name: poi_category
        data_type: VARCHAR
        description: Category code of the point of interest.
      - name: poi_category_name
        data_type: VARCHAR
        description: Category label of the point of interest.
      - name: poi_name
        data_type: VARCHAR
        description: Display name of the point of interest.
      - name: demand_weight
        data_type: INTEGER
        description: Raw demand weight of the POI within its zone.
      - name: allocation_factor
        data_type: DOUBLE
        description: The POI's share of its zone's total demand weight; multiply an allocated measure by it.
  - name: fct_trip
    description: |
      One row per TLC trip. The grain of the warehouse.

      {{ doc("fleet_attribution") }}
    contract: {enforced: true}
    columns:
      - name: trip_key
        description: '{{ doc("trip_key") }}'
        data_type: VARCHAR
        data_tests: [unique, not_null]
      - name: pickup_zone_key
        description: Role-playing zone key for the origin, resolved as of the trip date (Pickup_Zone role).
        data_type: VARCHAR
        data_tests: [{relationships: {arguments: {field: zone_key, to: ref('dim_zone')}}}]
      - name: dropoff_zone_key
        description: Role-playing zone key for the destination, resolved as of the trip date (Dropoff_Zone role).
        data_type: VARCHAR
        data_tests: [{relationships: {arguments: {field: zone_key, to: ref('dim_zone')}}}]
      - name: vendor_key
        data_type: VARCHAR
        data_tests: [{relationships: {arguments: {field: vendor_key, to: ref('dim_vendor')}}}]
        description: Vendor surrogate, resolved as of the trip date.
      - name: trip_quality_key
        data_type: VARCHAR
        data_tests: [{relationships: {arguments: {field: trip_quality_key, to: ref('dim_trip_quality')}}}]
        description: Junk-dimension key over the observed quality verdicts.
      - name: payment_method_key
        data_type: BIGINT
        data_tests: [{relationships: {arguments: {field: payment_method_key, to: ref('dim_payment_method')}}}]
        description: How the trip settled.
      - name: is_fleet_attributed
        description: '{{ doc("fleet_attribution") }}'
        data_type: BOOLEAN
        data_tests: [not_null]
      - name: fare_residual
        description: '{{ doc("fare_residual") }}'
        data_type: DOUBLE
      - name: airport_fee
        description: >
          Yellow only, rejoined from bronze. Null for every green trip by
          construction -- see airport_fee_status before aggregating it.
        data_type: DOUBLE
      - name: pickup_date_key
        data_type: INTEGER
        description: Surrogate key into date for the pickup date.
        data_tests: [{relationships: {arguments: {field: date_key, to: ref('dim_date')}}}]
      - name: pickup_date
        data_type: DATE
        description: Calendar date of pickup; report window grain is day.
      - name: pickup_hour
        data_type: BIGINT
        description: Hour of day of pickup (0-23), joins dim_daypart.
        data_tests: [{relationships: {arguments: {field: hour_of_day, to: ref('dim_daypart')}}}]
      - name: daypart_code
        data_type: VARCHAR
        description: Analyst-owned daypart band for pickup_hour.
      - name: service_type_key
        data_type: VARCHAR
        description: Fleet service type of the trip.
        data_tests: [{relationships: {arguments: {field: service_type_key, to: ref('dim_service_type')}}}]
      - name: rate_plan_key
        data_type: BIGINT
        description: Rate plan in effect for the trip.
        data_tests: [{relationships: {arguments: {field: rate_plan_key, to: ref('dim_rate_plan')}}}]
      - name: shift_id
        data_type: VARCHAR
        description: Attributed fleet shift; null for non-fleet trips.
      - name: driver_key
        data_type: BIGINT
      - name: vehicle_key
        data_type: INTEGER
      - name: assignment_method
        data_type: VARCHAR
      - name: pickup_datetime
        data_type: TIMESTAMP
      - name: dropoff_datetime
        data_type: TIMESTAMP
      - name: pickup_location_id
        data_type: INTEGER
        description: TLC location id of the pickup zone before the as-of join; the zone's natural key, and what the trip-to-zone join matches.
      - name: dropoff_location_id
        data_type: INTEGER
        description: TLC location id of the dropoff zone before the as-of join; the zone's natural key.
      - name: passenger_count
        data_type: BIGINT
      - name: store_and_fwd_flag
        data_type: VARCHAR
      - name: trip_type
        data_type: BIGINT
      - name: trip_distance
        data_type: DOUBLE
      - name: trip_seconds
        data_type: BIGINT
      - name: avg_mph
        data_type: DOUBLE
      - name: fare_amount
        data_type: DOUBLE
      - name: extra
        data_type: DOUBLE
      - name: mta_tax
        data_type: DOUBLE
      - name: tip_amount
        data_type: DOUBLE
      - name: tolls_amount
        data_type: DOUBLE
      - name: improvement_surcharge
        data_type: DOUBLE
      - name: congestion_surcharge
        data_type: DOUBLE
      - name: ehail_fee
        data_type: DOUBLE
      - name: total_amount
        data_type: DOUBLE
        description: Total amount charged, row level. Aggregate only through metrics.
      - name: total_surcharges
        data_type: DOUBLE
      - name: measurable_tip_rate
        data_type: DOUBLE
      - name: is_billable
        data_type: BOOLEAN
        description: Total amount is positive (ADR 0003). Null handling per ADR.
      - name: airport_fee_status
        data_type: VARCHAR
        description: Yellow only; null for every green trip by construction.
  - name: fct_shift
    description: One row per driver sign-on, bridging the operational world (occupancy, leases) and the revenue world (trips).
    contract: {enforced: true}
    columns:
      - name: shift_id
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Sign-on identifier; the grain of the fleet revenue fact.
      - name: driver_key
        data_type: BIGINT
        data_tests: [{relationships: {arguments: {field: driver_key, to: ref('dim_driver')}}}]
        description: Driver who signed on.
      - name: vehicle_key
        data_type: INTEGER
        data_tests: [{relationships: {arguments: {field: vehicle_key, to: ref('dim_vehicle')}}}]
        description: Vehicle operated during the shift.
      - name: occupancy_rate
        description: '{{ doc("occupancy_rate") }}'
        data_type: DOUBLE
      - name: shift_date_key
        data_type: INTEGER
        description: Surrogate key into date for the shift date.
        data_tests: [{relationships: {arguments: {field: date_key, to: ref('dim_date')}}}]
      - name: shift_date
        data_type: DATE
        description: Calendar date of sign-on.
      - name: garage_key
        data_type: BIGINT
        description: Driver's home garage at sign-on, carried from dim_driver; not the vehicle's garage.
        data_tests: [{relationships: {arguments: {field: garage_key, to: ref('dim_garage')}}}]
      - name: engagement_type
        data_type: VARCHAR
        description: How the driver is engaged (employee, contractor, ...).
      - name: lease_type
        data_type: VARCHAR
        description: Lease arrangement in force for the shift; null when the driver is not on a lease.
      - name: shift_start_ts
        data_type: TIMESTAMP
        description: Timestamp the driver signed on.
      - name: effective_end_ts
        data_type: TIMESTAMP
      - name: is_unclosed_shift
        data_type: BOOLEAN
        description: True when no sign-off event closed the shift and the effective end was used instead.
      - name: online_seconds
        data_type: BIGINT
        description: Signed-on seconds, to the shift's effective end. Denominator of the rate metrics; aggregate only through metrics.
      - name: on_trip_seconds
        data_type: HUGEINT
        description: Seconds spent carrying a fare. Numerator of occupancy; aggregate only through metrics.
      - name: available_seconds
        data_type: HUGEINT
      - name: break_seconds
        data_type: HUGEINT
      - name: unaccounted_seconds
        data_type: HUGEINT
      - name: idle_rate
        data_type: DOUBLE
      - name: trip_count
        data_type: BIGINT
        description: Trips attributed to the shift, row level; sum it rather than reading a single row.
      - name: gross_revenue
        data_type: DOUBLE
        description: Revenue earned on the shift's trips, row level; aggregate only through metrics.
      - name: fare_revenue
        data_type: DOUBLE
      - name: tip_revenue
        data_type: DOUBLE
      - name: airport_fee_collected
        data_type: DOUBLE
      - name: surcharge_collected
        data_type: DOUBLE
      - name: recognised_revenue
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: paid_seconds
        data_type: HUGEINT
      - name: shift_cost
        data_type: DOUBLE
      - name: shift_margin
        data_type: DOUBLE
      - name: revenue_per_online_hour
        data_type: DOUBLE
        description: Gross revenue per online hour, from summed revenue and summed hours. The driver ranking basis (ADR 0010).
      - name: revenue_per_paid_mile
        data_type: DOUBLE
      - name: odometer_miles
        data_type: DOUBLE
      - name: paid_mile_ratio
        data_type: DOUBLE
      - name: negative_interval_count
        data_type: BIGINT
      - name: telematics_source
        data_type: VARCHAR
  - name: fct_status_interval
    description: One row per driver state interval. The only place idle time is locatable — a trip says where a driver earned, this says where they waited.
    contract: {enforced: true}
    columns:
      - name: interval_id
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Interval identifier; the grain of the occupancy fact.
      - name: status_code
        data_type: VARCHAR
        data_tests: [{accepted_values: {arguments: {values: [LOGIN, AVAILABLE, DISPATCHED, ON_TRIP, BREAK, LOGOUT]}}}]
        description: Driver state for the interval (LOGIN, AVAILABLE, DISPATCHED, ON_TRIP, BREAK, LOGOUT).
      - name: shift_id
        data_type: VARCHAR
        description: Shift the interval belongs to.
      - name: driver_key
        data_type: BIGINT
        description: Driver the interval is attributed to.
        data_tests: [{relationships: {arguments: {field: driver_key, to: ref('dim_driver')}}}]
      - name: vehicle_key
        data_type: INTEGER
        description: Vehicle the driver was in during the interval.
        data_tests: [{relationships: {arguments: {field: vehicle_key, to: ref('dim_vehicle')}}}]
      - name: interval_date_key
        data_type: INTEGER
        description: Surrogate key into date for the interval date.
        data_tests: [{relationships: {arguments: {field: date_key, to: ref('dim_date')}}}]
      - name: interval_date
        data_type: DATE
        description: Calendar date the interval started.
      - name: interval_hour
        data_type: BIGINT
        description: Hour of day the interval started (0-23), joins dim_daypart.
        data_tests: [{relationships: {arguments: {field: hour_of_day, to: ref('dim_daypart')}}}]
      - name: daypart_code
        data_type: VARCHAR
        description: Analyst-owned daypart band for interval_hour.
      - name: zone_key
        data_type: VARCHAR
        description: Zone surrogate resolved to the current version of the zone.
        data_tests: [{relationships: {arguments: {field: zone_key, to: ref('dim_zone')}}}]
      - name: zone_natural_key
        data_type: INTEGER
        description: TLC location_id of the interval's zone.
      - name: interval_start_ts
        data_type: TIMESTAMP
      - name: interval_end_ts
        data_type: TIMESTAMP
      - name: interval_seconds
        data_type: BIGINT
        description: Duration of the interval. Sum it for time; do not read a single row.
      - name: is_terminal_interval
        data_type: BOOLEAN
      - name: is_negative_interval
        data_type: BOOLEAN
        description: True when the event stream closes the interval before it opens; a quality flag, not a duration.
      - name: skew_seconds
        data_type: BIGINT
  - name: fct_maintenance
    description: One row per vehicle maintenance event. Semi-additive — down-days sum across vehicles but not across overlapping date ranges, so availability expands this to a daily grain rather than summing the column.
    contract: {enforced: true}
    columns:
      - name: maintenance_id
        data_type: VARCHAR
        data_tests: [unique, not_null]
        description: Maintenance event identifier; the grain of the downtime fact.
      - name: vehicle_key
        data_type: BIGINT
        description: Vehicle that was in the shop.
        data_tests: [{relationships: {arguments: {field: vehicle_key, to: ref('dim_vehicle')}}}]
      - name: garage_key
        data_type: BIGINT
        description: Garage the vehicle belongs to, carried from dim_vehicle.
        data_tests: [{relationships: {arguments: {field: garage_key, to: ref('dim_garage')}}}]
      - name: started_date_key
        data_type: INTEGER
        description: Surrogate key into date for the start date.
        data_tests: [{relationships: {arguments: {field: date_key, to: ref('dim_date')}}}]
      - name: started_date
        data_type: TIMESTAMP WITH TIME ZONE
        description: First day of the downtime.
      - name: ended_date
        data_type: TIMESTAMP WITH TIME ZONE
        description: Last day of the downtime; a range end, not a time dimension.
      - name: down_days
        data_type: BIGINT
        description: Days out of service for the event; semi-additive across overlapping ranges.
      - name: maintenance_type
        data_type: VARCHAR
        description: Kind of work performed.
      - name: cost_usd
        data_type: BIGINT
        description: Cost of the event in USD, row level.

version: 2

models:
  - name: mart_driver_scorecard
    description: >
      Driver performance, ranked within garage and fleet-wide. Ranking is on
      revenue per online hour, not gross revenue -- gross rewards whoever worked
      the most hours, which is a roster fact rather than a performance one.
      Drivers below the hours floor are carried but flagged.
    contract: {enforced: true}
    columns:
      - name: driver_key
        tests: [unique, not_null]
        data_type: BIGINT
      - name: is_below_ranking_floor
        tests: [not_null]
        data_type: BOOLEAN
      - name: occupancy_rate
        description: '{{ doc("occupancy_rate") }}'
        data_type: DOUBLE
      - name: driver_ref
        data_type: VARCHAR
      - name: engagement_type
        data_type: VARCHAR
      - name: garage_key
        data_type: BIGINT
      - name: home_garage_name
        data_type: VARCHAR
      - name: active_days
        data_type: HUGEINT
      - name: shift_count
        data_type: HUGEINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: tip_revenue
        data_type: DOUBLE
      - name: total_cost
        data_type: DOUBLE
      - name: total_margin
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: revenue_per_online_hour
        data_type: DOUBLE
      - name: revenue_per_trip
        data_type: DOUBLE
      - name: trips_per_online_hour
        data_type: DOUBLE
      - name: tip_share
        data_type: DOUBLE
      - name: fleet_rank
        data_type: BIGINT
      - name: garage_rank
        data_type: BIGINT
      - name: revenue_quartile
        data_type: BIGINT
      - name: occupancy_percentile
        data_type: DOUBLE
  - name: mart_vehicle_utilisation
    description: Asset utilisation for the period with downtime netted out.
    contract: {enforced: true}
    columns:
      - name: vehicle_key
        tests: [unique, not_null]
        data_type: BIGINT
      - name: medallion_number
        data_type: VARCHAR
      - name: make_model
        data_type: VARCHAR
      - name: model_year
        data_type: BIGINT
      - name: fuel_type
        data_type: VARCHAR
      - name: is_low_emission
        data_type: BOOLEAN
      - name: garage_key
        data_type: BIGINT
      - name: garage_name
        data_type: VARCHAR
      - name: is_in_service
        data_type: BOOLEAN
      - name: active_days
        data_type: HUGEINT
      - name: shift_count
        data_type: HUGEINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: down_days
        data_type: HUGEINT
      - name: maintenance_cost
        data_type: HUGEINT
      - name: available_days
        data_type: HUGEINT
      - name: occupancy_rate
        data_type: DOUBLE
      - name: availability_adjusted_rate
        data_type: DOUBLE
      - name: revenue_per_online_hour
        data_type: DOUBLE
      - name: net_revenue_per_active_day
        data_type: DOUBLE
  - name: mart_trip_quality_scorecard
    description: >
      What proportion of the feed is trustworthy and whose records are not.
      Aggregated through the junk dimension so every verdict is groupable.
    contract: {enforced: true}
    columns:
      - name: trip_month
        data_type: TIMESTAMP
      - name: vendor_id
        data_type: INTEGER
      - name: vendor_legal_name
        data_type: VARCHAR
      - name: service_type_key
        data_type: VARCHAR
      - name: trip_count
        data_type: BIGINT
      - name: clean_trip_count
        data_type: BIGINT
      - name: non_billable_count
        data_type: BIGINT
      - name: refund_count
        data_type: BIGINT
      - name: zero_distance_count
        data_type: BIGINT
      - name: implausible_speed_count
        data_type: BIGINT
      - name: sparse_feed_count
        data_type: BIGINT
      - name: unresolved_zone_count
        data_type: BIGINT
      - name: undocumented_rate_count
        data_type: BIGINT
      - name: unbalanced_total_count
        data_type: BIGINT
      - name: clean_rate
        data_type: DOUBLE
      - name: sparse_feed_rate
        data_type: DOUBLE

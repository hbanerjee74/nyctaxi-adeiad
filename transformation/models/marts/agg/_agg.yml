version: 2

models:
  - name: agg_trip_zone_daypart_dow
    description: >
      The demand cube: one row per pickup zone, day of week, non-working-day
      flag, daypart, peak flag and fleet. A holiday Monday and a working Monday
      are separate rows, and the early daypart splits into its off-peak and
      peak hours, so sum the rows to answer at zone x daypart x day of week.
      The grain most operational questions land on. Tip metrics are restricted to payment
      methods where the meter captures tips, and the covered share is published
      alongside so the reader can see how much traffic the rate speaks for.
    contract: {enforced: true}
    columns:
      - name: avg_measurable_tip_rate
        description: '{{ doc("measurable_tip_rate") }}'
        data_type: DOUBLE
      - name: trip_count
        tests: [not_null]
        data_type: BIGINT
      - name: pickup_location_id
        data_type: BIGINT
      - name: zone_name
        data_type: VARCHAR
      - name: borough_name
        data_type: VARCHAR
      - name: reporting_region
        data_type: VARCHAR
      - name: zone_class
        data_type: VARCHAR
      - name: is_airport_zone
        data_type: BOOLEAN
      - name: day_of_week
        data_type: BIGINT
      - name: day_name
        data_type: VARCHAR
      - name: is_weekend
        data_type: BOOLEAN
      - name: is_non_working_day
        data_type: BOOLEAN
      - name: daypart_code
        data_type: VARCHAR
      - name: daypart_name
        data_type: VARCHAR
      - name: is_peak
        data_type: BOOLEAN
      - name: service_type_key
        data_type: VARCHAR
      - name: billable_trip_count
        data_type: BIGINT
      - name: total_revenue
        data_type: DOUBLE
      - name: fare_revenue
        data_type: DOUBLE
      - name: tip_revenue
        data_type: DOUBLE
      - name: surcharge_revenue
        data_type: DOUBLE
      - name: total_miles
        data_type: DOUBLE
      - name: total_paid_hours
        data_type: DOUBLE
      - name: avg_total_amount
        data_type: DOUBLE
      - name: avg_trip_distance
        data_type: DOUBLE
      - name: avg_trip_minutes
        data_type: DOUBLE
      - name: median_total_amount
        data_type: DOUBLE
      - name: measurable_tip_trip_count
        data_type: BIGINT
      - name: tip_measurable_share
        data_type: DOUBLE
  - name: agg_trip_zone_daily
    description: >
      Daily zone demand with period-over-period context. The window functions are
      the point: a raw count answers "how many", the lag and rolling average
      answer "is that normal".
    contract: {enforced: true}
    columns:
      - name: pickup_date_key
        data_type: INTEGER
      - name: pickup_date
        data_type: DATE
      - name: pickup_location_id
        data_type: BIGINT
      - name: zone_name
        data_type: VARCHAR
      - name: borough_name
        data_type: VARCHAR
      - name: trip_count
        data_type: BIGINT
      - name: total_revenue
        data_type: DOUBLE
      - name: total_miles
        data_type: DOUBLE
      - name: attributed_driver_count
        data_type: BIGINT
      - name: prev_day_trip_count
        data_type: BIGINT
      - name: same_day_last_week_trip_count
        data_type: BIGINT
      - name: trip_count_7d_avg
        data_type: DOUBLE
      - name: revenue_28d_rolling
        data_type: DOUBLE
      - name: revenue_rank_that_day
        data_type: BIGINT
  - name: agg_od_flow_matrix
    description: >
      Origin-to-destination flow -- the same zone dimension joined twice, in both
      roles. Published only for pairs with at least 25 billable trips (ADR 0017).
    contract: {enforced: true}
    columns:
      - name: origin_location_id
        data_type: BIGINT
      - name: origin_zone
        data_type: VARCHAR
      - name: origin_borough
        data_type: VARCHAR
      - name: origin_is_airport
        data_type: BOOLEAN
      - name: dest_location_id
        data_type: BIGINT
      - name: dest_zone
        data_type: VARCHAR
      - name: dest_borough
        data_type: VARCHAR
      - name: dest_is_airport
        data_type: BOOLEAN
      - name: is_intra_borough
        data_type: BOOLEAN
      - name: trip_count
        data_type: BIGINT
      - name: total_revenue
        data_type: DOUBLE
      - name: avg_fare
        data_type: DOUBLE
      - name: avg_distance
        data_type: DOUBLE
      - name: avg_minutes
        data_type: DOUBLE
      - name: avg_corridor_mph
        data_type: DOUBLE
  - name: agg_trip_band_profile
    description: >
      Distance, duration and fare banding in one profile. Three independent range
      joins with half-open bands, so a trip of exactly three miles lands in
      "3 - 6" once rather than in two bands or none. The joins are LEFT joins:
      a refund or a negative duration falls outside every band and appears once
      as 'unbanded' (order 0), so the profile covers every in-window trip and
      sum(trip_count) equals fct_trip's count.
    contract: {enforced: true}
    columns:
      - name: distance_band
        data_type: VARCHAR
      - name: distance_band_order
        data_type: INTEGER
      - name: duration_band
        data_type: VARCHAR
      - name: duration_band_order
        data_type: INTEGER
      - name: fare_band
        data_type: VARCHAR
      - name: fare_band_order
        data_type: INTEGER
      - name: service_type_key
        data_type: VARCHAR
      - name: pickup_borough
        data_type: VARCHAR
      - name: daypart_code
        data_type: VARCHAR
      - name: trip_count
        data_type: BIGINT
      - name: total_revenue
        data_type: DOUBLE
      - name: avg_total_amount
        data_type: DOUBLE
      - name: avg_measurable_tip_rate
        data_type: DOUBLE
      - name: non_billable_count
        data_type: BIGINT
  - name: agg_weather_demand_daily
    description: >
      Demand against weather, by borough and day. The spine is every borough
      crossed with every day in the window, so a borough-day with weather and no
      trips keeps a zero row, and a trip in an unresolved or non-weather borough
      keeps its row with null weather (ADR 0012) instead of disappearing. Trips
      are attributed through their own zone surrogate, the version resolved as of
      the trip's date (ADR 0009), not the borough's current version.
    contract: {enforced: true}
    columns:
      - name: obs_date
        data_type: DATE
      - name: borough_name
        data_type: VARCHAR
      - name: day_name
        data_type: VARCHAR
      - name: is_weekend
        data_type: BOOLEAN
      - name: is_holiday
        data_type: BOOLEAN
      - name: temp_avg_f
        data_type: DOUBLE
      - name: precip_inches
        data_type: DOUBLE
      - name: snow_inches
        data_type: DOUBLE
      - name: is_wet_day
        data_type: BOOLEAN
      - name: is_snow_day
        data_type: BOOLEAN
      - name: weather_class
        data_type: VARCHAR
      - name: trip_count
        data_type: BIGINT
      - name: total_revenue
        data_type: DOUBLE
      - name: avg_trip_distance
        data_type: DOUBLE
      - name: avg_fare
        data_type: DOUBLE
      - name: avg_paid_hours_per_trip
        data_type: DOUBLE
  - name: agg_driver_daily
    description: >
      Driver-day, the base of the driver pyramid. Rates are rebuilt from summed
      numerators and denominators, never averaged from shift rates -- the mean of
      two ratios is not the ratio anyone asked for.
    contract: {enforced: true}
    columns:
      - name: occupancy_rate
        description: '{{ doc("occupancy_rate") }}'
        data_type: DOUBLE
      - name: shift_date
        data_type: DATE
      - name: date_key
        data_type: INTEGER
      - name: driver_key
        data_type: BIGINT
      - name: driver_ref
        data_type: VARCHAR
      - name: engagement_type
        data_type: VARCHAR
      - name: garage_key
        data_type: BIGINT
      - name: home_garage_name
        data_type: VARCHAR
      - name: shift_count
        data_type: BIGINT
      - name: vehicles_driven
        data_type: BIGINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: break_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: tip_revenue
        data_type: DOUBLE
      - name: airport_fee_collected
        data_type: DOUBLE
      - name: total_cost
        data_type: DOUBLE
      - name: total_margin
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: unclosed_shift_count
        data_type: HUGEINT
      - name: revenue_per_online_hour
        data_type: DOUBLE
      - name: revenue_per_trip
        data_type: DOUBLE
  - name: agg_driver_monthly
    description: >
      Driver-month, built from driver-day rather than from shifts again. Each
      level is built from the one below so the pyramid cannot disagree with
      itself.
    contract: {enforced: true}
    columns:
      - name: month_start_date
        data_type: TIMESTAMP
      - name: driver_key
        data_type: BIGINT
      - name: driver_ref
        data_type: VARCHAR
      - name: engagement_type
        data_type: VARCHAR
      - name: garage_key
        data_type: BIGINT
      - name: home_garage_name
        data_type: VARCHAR
      - name: active_days
        data_type: BIGINT
      - name: shift_count
        data_type: HUGEINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: tip_revenue
        data_type: DOUBLE
      - name: total_cost
        data_type: DOUBLE
      - name: total_margin
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: occupancy_rate
        data_type: DOUBLE
      - name: revenue_per_online_hour
        data_type: DOUBLE
      - name: trips_per_online_hour
        data_type: DOUBLE
      - name: margin_rate
        data_type: DOUBLE
  - name: agg_vehicle_daily
    description: >
      Vehicle-day. The asset view of the same shifts. Asset utilisation is taken
      against the 24-hour day, not against sign-on time -- a medallion idle in the
      depot is the asset question, a driver idle on the road is the labour
      question, and they are different numbers.
    contract: {enforced: true}
    columns:
      - name: shift_date
        data_type: DATE
      - name: date_key
        data_type: INTEGER
      - name: vehicle_key
        data_type: INTEGER
      - name: medallion_number
        data_type: VARCHAR
      - name: make_model
        data_type: VARCHAR
      - name: fuel_type
        data_type: VARCHAR
      - name: is_low_emission
        data_type: BOOLEAN
      - name: garage_key
        data_type: BIGINT
      - name: shift_count
        data_type: BIGINT
      - name: distinct_drivers
        data_type: BIGINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: odometer_miles
        data_type: DOUBLE
      - name: occupancy_rate
        data_type: DOUBLE
      - name: asset_utilisation_rate
        data_type: DOUBLE
      - name: paid_mile_ratio
        data_type: DOUBLE
  - name: agg_vehicle_monthly
    description: >
      Vehicle-month with maintenance downtime netted out of the denominator. A
      vehicle in the shop for six days has 24 fewer available days, and charging
      it with those days makes a well-run asset look idle.
    contract: {enforced: true}
    columns:
      - name: month_start_date
        data_type: TIMESTAMP
      - name: vehicle_key
        data_type: INTEGER
      - name: medallion_number
        data_type: VARCHAR
      - name: make_model
        data_type: VARCHAR
      - name: fuel_type
        data_type: VARCHAR
      - name: garage_key
        data_type: BIGINT
      - name: active_days
        data_type: BIGINT
      - name: shift_count
        data_type: HUGEINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: paid_miles
        data_type: DOUBLE
      - name: down_days
        data_type: HUGEINT
      - name: maintenance_cost
        data_type: HUGEINT
      - name: calendar_days
        data_type: BIGINT
      - name: available_days
        data_type: HUGEINT
      - name: availability_adjusted_activity_rate
        data_type: DOUBLE
      - name: occupancy_rate
        data_type: DOUBLE
      - name: revenue_per_online_hour
        data_type: DOUBLE
  - name: agg_garage_monthly
    description: Garage-month. The top of the driver, vehicle and garage pyramid.
    contract: {enforced: true}
    columns:
      - name: month_start_date
        data_type: TIMESTAMP
      - name: garage_key
        data_type: INTEGER
      - name: garage_name
        data_type: VARCHAR
      - name: borough_name
        data_type: VARCHAR
      - name: bay_capacity
        data_type: INTEGER
      - name: active_vehicles
        data_type: BIGINT
      - name: shift_count
        data_type: HUGEINT
      - name: trip_count
        data_type: HUGEINT
      - name: online_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: gross_revenue
        data_type: DOUBLE
      - name: maintenance_cost
        data_type: HUGEINT
      - name: down_days
        data_type: HUGEINT
      - name: occupancy_rate
        data_type: DOUBLE
      - name: revenue_per_online_hour
        data_type: DOUBLE
      - name: bay_occupancy_rate
        data_type: DOUBLE
  - name: agg_zone_occupancy_hourly
    description: >
      Where the fleet spends its time, by zone and hour, from the status stream
      rather than from trips. The gap between this map and the revenue map is the
      whole reason occupancy is collected.
    contract: {enforced: true}
    columns:
      - name: interval_date
        data_type: DATE
      - name: interval_hour
        data_type: BIGINT
      - name: daypart_code
        data_type: VARCHAR
      - name: location_id
        data_type: BIGINT
      - name: zone_name
        data_type: VARCHAR
      - name: borough_name
        data_type: VARCHAR
      - name: is_airport_zone
        data_type: BOOLEAN
      - name: interval_count
        data_type: BIGINT
      - name: distinct_drivers
        data_type: BIGINT
      - name: distinct_vehicles
        data_type: BIGINT
      - name: total_hours
        data_type: DOUBLE
      - name: on_trip_hours
        data_type: DOUBLE
      - name: available_hours
        data_type: DOUBLE
      - name: break_hours
        data_type: DOUBLE
      - name: zone_occupancy_rate
        data_type: DOUBLE

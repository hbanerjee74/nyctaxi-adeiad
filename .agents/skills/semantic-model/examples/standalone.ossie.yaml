version: "0.2.0.dev0"
name: example_standalone
description: "Skeleton of a standalone model — copy this shape. One dataset, no relationships, one physical table with a note naming the narrower rule it applies."
datasets:
  - name: daily_zone_revenue
    source: finance.mart_daily_zone_revenue
    primary_key: [revenue_date, zone_key]
    description: "Daily revenue by zone. Billable trips only, so its counts answer a narrower population than the fact."
    fields:
      - name: revenue_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: revenue_date
        datatype: Date
        dimension:
          is_time: true
      - name: zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_key
        datatype: String
      - name: zone_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_name
        datatype: String
      - name: trip_count
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_count
        datatype: Integer
      - name: total_revenue
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: total_revenue
        datatype: Decimal
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_detail", "physical_table": "mart_daily_zone_revenue", "priority_group": 1, "content_grain": ["revenue_date", "zone_key"], "note": "Billable-only population: this table may not supply the star-level trip_count or revenue metrics.", "column_map": {"revenue_date": "revenue_date", "zone_key": "zone_key", "zone_name": "zone_name", "trip_count": "trip_count", "total_revenue": "total_revenue"}}]}'
metrics:
  - name: billable_zone_day_trip_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(daily_zone_revenue.trip_count)
    description: Billable trips per zone and day. Scope-prefixed because the star's trip_count is a different population.
    datatype: Integer
  - name: billable_zone_day_revenue
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(daily_zone_revenue.total_revenue)
    datatype: Decimal
custom_extensions:
  - vendor_name: VIBEDATA
    data: '{"vibedata_version": "1.5", "physical_tables": [{"name": "mart_daily_zone_revenue", "source": "finance.mart_daily_zone_revenue", "dbt_model": "mart_daily_zone_revenue", "table_type": "TABLE", "note": "Standalone: billable-only population, so it is not an aggregate source for the trip star."}], "physical_joins": []}'
